<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070A12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070A12'/%3E%3Cpath d='M9 8v16M16 6v20M23 10v12' stroke='%23D8B36A' stroke-width='2'/%3E%3Crect x='6.5' y='12' width='5' height='8' rx='1' fill='%233DD68C'/%3E%3Crect x='13.5' y='9' width='5' height='9' rx='1' fill='%23FF6B6B'/%3E%3Crect x='20.5' y='13' width='5' height='6' rx='1' fill='%233DD68C'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bitácora de Trading</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: terminal premium en una columna. Oscuro con dorado (riqueza) y velas verde/rojo como detalle; versión clara porcelana */
:root{
  --bg:#070A12; --bg-glow1:rgba(217,180,106,.13); --bg-glow2:rgba(96,124,255,.12); --gridline:rgba(255,255,255,.028);
  --surface:#0E1422; --surface-hi:#131B2D; --surface2:#141C2E; --input:#0A0F1B; --line:#1F2940; --line-strong:#2C3956;
  --fg:#EEF1F7; --muted:#8C97B1; --accent:#D8B36A; --accent-2:#F2D9A2; --accent-fg:#1A1306; --accent-soft:rgba(216,179,106,.12);
  --sapphire:#7C95FF; --win:#3DD68C; --win-soft:rgba(61,214,140,.13); --loss:#FF6B6B; --loss-soft:rgba(255,107,107,.13);
  --warn:#F2B64B; --warn-soft:rgba(242,182,75,.13); --on-sem:#06100B;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 18px 40px -24px rgba(0,0,0,.75); --candle-op:.5;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:16px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F3F7; --bg-glow1:rgba(169,124,43,.10); --bg-glow2:rgba(70,98,220,.08); --gridline:rgba(14,20,36,.035);
  --surface:#FFFFFF; --surface-hi:#FFFFFF; --surface2:#F6F7FA; --input:#F7F8FB; --line:#E1E4EC; --line-strong:#CBD1DE;
  --fg:#0D1322; --muted:#5A6480; --accent:#8C6820; --accent-2:#C59A45; --accent-fg:#FFFFFF; --accent-soft:rgba(169,124,43,.10);
  --sapphire:#3F5BD6; --win:#0F8A57; --win-soft:rgba(15,138,87,.10); --loss:#D23B3B; --loss-soft:rgba(210,59,59,.09);
  --warn:#A8680E; --warn-soft:rgba(168,104,14,.10); --on-sem:#FFFFFF;
  --shadow:0 1px 2px rgba(13,19,34,.04),0 14px 34px -22px rgba(13,19,34,.22); --candle-op:.32; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2F3F7; --bg-glow1:rgba(169,124,43,.10); --bg-glow2:rgba(70,98,220,.08); --gridline:rgba(14,20,36,.035);
  --surface:#FFFFFF; --surface-hi:#FFFFFF; --surface2:#F6F7FA; --input:#F7F8FB; --line:#E1E4EC; --line-strong:#CBD1DE;
  --fg:#0D1322; --muted:#5A6480; --accent:#8C6820; --accent-2:#C59A45; --accent-fg:#FFFFFF; --accent-soft:rgba(169,124,43,.10);
  --sapphire:#3F5BD6; --win:#0F8A57; --win-soft:rgba(15,138,87,.10); --loss:#D23B3B; --loss-soft:rgba(210,59,59,.09);
  --warn:#A8680E; --warn-soft:rgba(168,104,14,.10); --on-sem:#FFFFFF;
  --shadow:0 1px 2px rgba(13,19,34,.04),0 14px 34px -22px rgba(13,19,34,.22); --candle-op:.32; color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;font-stretch:100%}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{padding-block:20px 14px;display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.daybig{display:flex;align-items:baseline;gap:10px;line-height:.85}
.daybig .lbl{font-family:var(--f-display);font-stretch:75%;font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.daybig .n{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(48px,11vw,84px);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.top-meta{flex:1;min-width:240px;display:grid;gap:12px}
.since{color:var(--muted);font-size:14px}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:flex;gap:8px;align-items:baseline;font-size:13px}
.kpi b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px}
.kpi.pos b{color:var(--win)} .kpi.neg b{color:var(--loss)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;align-items:center;gap:2px;overflow-x:auto}
.tab{background:none;border:0;padding:12px 11px 10px;font-family:var(--f-display);font-weight:650;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.status{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:12px}
.status.err{color:var(--loss)}

main{padding-block:20px 80px;display:grid;gap:16px}
.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}
.goalband{border-radius:8px;padding:10px 12px;background:var(--accent-soft);font-size:14px}
.goalband b{font-family:var(--f-display);letter-spacing:.02em}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.card-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.card-h h2{font-size:19px;font-weight:700}
.card-h .when{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.card-h .aside{margin-left:auto;font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
h3.sub{font-size:15px;font-weight:700}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=date],input[type=url],select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
textarea{min-height:76px;resize:vertical;field-sizing:content}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--loss)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;font-size:14px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg.ok-bad button.on-ok{background:var(--win);color:var(--on-sem)}
.seg.ok-bad button.on-bad{background:var(--loss);color:var(--on-sem)}
.seg.ok-bad button.on-mid{background:var(--warn);color:var(--on-sem)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px}
.chipbtn[aria-pressed="true"]{background:var(--loss-soft);border-color:var(--loss);color:var(--loss);font-weight:600}

.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.datebar .d{font-family:var(--f-display);font-weight:700;font-size:20px}
.datebar .d::first-letter{text-transform:uppercase}
.datebar .tag{font-family:var(--f-mono);font-size:12px;background:var(--accent-soft);color:var(--fg);padding:3px 8px;border-radius:6px}

.rules{display:grid;gap:8px}
.rule{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.rule.broken{border-color:var(--loss);background:var(--loss-soft)}
.rule.ok{border-color:color-mix(in srgb,var(--win) 50%,var(--line))}
.rule .t{min-width:0;font-size:14px}
.rule .c{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:block}
.callout{border-radius:8px;padding:12px 14px;background:var(--loss-soft);border:1px solid var(--loss);display:grid;gap:8px}
.callout b{color:var(--loss)}
@media (max-width:560px){.rule{grid-template-columns:1fr}}

.trade{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;background:var(--surface2);border-left-width:4px;min-width:0}
.trade.w{border-left-color:var(--win)} .trade.l{border-left-color:var(--loss)}
.trade-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.trade-h h3{font-size:16px}
.rpill{font-family:var(--f-mono);font-size:13px;padding:3px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.rpill.w{background:var(--win-soft);color:var(--win);border-color:transparent}
.rpill.l{background:var(--loss-soft);color:var(--loss);border-color:transparent}
.calc{font-size:12px;color:var(--muted)}
.daysum{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.daysum b{font-family:var(--f-mono)}
.conds{display:grid;gap:6px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.conds label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.conds input{margin-top:4px}
.conds .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.media.sm{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.mitem{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);aspect-ratio:4/3;max-width:100%}
.mitem img,.mitem video{width:100%;height:100%;object-fit:cover;display:block}
.mitem img{cursor:zoom-in}
.mitem .x{position:absolute;top:6px;right:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:12px;padding:3px 7px}
.upl{display:inline-flex;align-items:center;gap:8px;position:relative}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.links{display:grid;gap:6px}
.links a{word-break:break-all;font-size:14px}

.monthbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.monthbar h2{font-size:22px;text-transform:capitalize;min-width:170px}
.msum{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.msum b{color:var(--fg);font-family:var(--f-mono)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:center;padding-bottom:2px}
.cell{min-height:88px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 7px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
.cell.out{background:none;border-style:dashed;opacity:.45}
.cell.pre{background:none;opacity:.5}
.cell.miss{border-style:dashed}
.cell.today{outline:2px solid var(--accent);outline-offset:-2px}
.cell.w{background:var(--win-soft)} .cell.l{background:var(--loss-soft)} .cell.flat{background:var(--surface2)}
.cell .dn{font-family:var(--f-mono);font-size:13px;font-weight:600}
.cell .pd{font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.cell .rv{font-family:var(--f-mono);font-size:14px;font-weight:600;margin-top:auto}
.cell.w .rv{color:var(--win)} .cell.l .rv{color:var(--loss)}
.cell .ic{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .flag{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--loss)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
@media (max-width:560px){.cell{min-height:64px;padding:4px}.cell .pd,.cell .ic{display:none}.cell .rv{font-size:11px}.cal{gap:3px}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface2);display:grid;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.v.pos{color:var(--win)} .v.neg{color:var(--loss)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
th.n{text-align:right}
td.wrap{white-space:normal;min-width:180px}
.chart svg{width:100%;height:auto;display:block}
.bar{height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.done i{background:var(--win)}
.plainlist{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}

.phases{display:grid;gap:10px}
.phase{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--surface2)}
.phase.cur{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 1px var(--accent)}
.phase.done{opacity:.75}
.phase-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.phase-h h3{font-size:17px}
.chip{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip.cur{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip.done{background:var(--win-soft);color:var(--win);border-color:transparent}
.goal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;align-items:center}
.goal .bar{grid-column:1/-1}
.goal .gv{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

.ruleedit{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:start}
@media (max-width:560px){.ruleedit{grid-template-columns:1fr auto}.ruleedit select{grid-column:1/-1}}
.empty{color:var(--muted);font-size:14px;padding:6px 0;margin:0}
.setupstat{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.setupstat b{font-family:var(--f-mono);color:var(--fg)}

/* Mentor y revisión */
.md{font-size:15px;line-height:1.6;display:grid;gap:8px;min-width:0;overflow-wrap:anywhere}
.md p,.md ul,.md ol{margin:0}
.md ul,.md ol{padding-left:20px;display:grid;gap:4px}
.md h4{font-size:15px;font-weight:700;margin-top:6px}
.md code{font-family:var(--f-mono);font-size:13px;background:var(--surface2);padding:1px 5px;border-radius:4px}
.thread{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.thread-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;width:100%;text-align:left;background:none;border:0;padding:14px 16px}
.thread-h h3{font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere}
.thread-h .meta{font-size:12px;color:var(--muted)}
.thread-b{display:grid;gap:12px;padding:0 16px 16px}
.msg{border-radius:10px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.msg.user{background:var(--accent-soft);justify-self:end;max-width:min(600px,100%)}
.msg.ai{background:var(--surface2);border:1px solid var(--line)}
.msg .who{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--muted)}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
.composer{display:grid;gap:10px;padding:14px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface2)}
.thinking{color:var(--muted);font-style:italic}
.review{border:1px solid var(--accent);border-radius:var(--r);padding:16px;background:var(--surface);display:grid;gap:10px}

.vision{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.vtile{margin:0;display:grid;gap:8px;min-width:0}
.vimg{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.vimg img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.vtag{position:absolute;left:8px;bottom:8px;background:var(--surface)}
.vcap{display:grid;gap:6px;min-width:0}
.vcap select{width:auto;flex:1}
.gvision{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gvision figure{margin:0;position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--surface2)}
.gvision img{width:100%;height:100%;object-fit:cover;display:block}
.gvision figcaption{position:absolute;inset:auto 0 0 0;padding:18px 10px 8px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));line-height:1.3}
@media (max-width:560px){.gvision{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chipbtn.tagf[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.ideas{display:grid;gap:10px}
.idea{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface2);min-width:0}
.thread-h .mono{flex:none}
.road-pct{display:flex;align-items:center;gap:14px}
.road-pct .num{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(40px,9vw,64px);line-height:1;letter-spacing:-.02em}
.road-pct .bar{height:12px;border-radius:6px}
.goalcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.goalcard{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface2);display:grid;gap:6px;min-width:0}

function normPlan(p){
  const out=Object.assign(clone(DEFAULT_PLAN),p||{});
  if(!Array.isArray(out.playbook)){
    const names=String(out.setups||"").split(",").map(s=>s.trim()).filter(Boolean);
    out.playbook=names.map((n,i)=>DEFAULT_PLAYBOOK.find(s=>s.name===n)?clone(DEFAULT_PLAYBOOK.find(s=>s.name===n)):{id:"s"+uid(),name:n,conditions:"",entry:"",stop:"",target:"",avoid:"",notes:"",media:[]});
  }
  out.playbook.forEach(s=>{if(!Array.isArray(s.media))s.media=[]});
  if(!Array.isArray(out.rules))out.rules=[];
  const g=out.goals&&typeof out.goals==="object"?out.goals:{};
  const long=Array.isArray(g.long)?g.long.slice(0,3).map(x=>String(x||"")):[];while(long.length<3)long.push("");
  const short=Array.isArray(g.short)?g.short.slice(0,10).map(x=>typeof x==="string"?{text:x,done:false}:{text:String((x&&x.text)||""),done:!!(x&&x.done)}):[];
  while(short.length<10)short.push({text:"",done:false});
  out.goals={long,short,showAlways:g.showAlways!==false};
  out.vision=Array.isArray(out.vision)?out.vision.filter(v=>v&&v.id).map(v=>({id:v.id,type:"image",name:v.name||"",caption:v.caption||"",tag:v.tag||""})):[];
  const rd=out.road&&typeof out.road==="object"?out.road:{};
  out.road={done:rd.done&&typeof rd.done==="object"?rd.done:{},netWorth:rd.netWorth==null?"":String(rd.netWorth)};
  return out;
}

function errText(e){

async function flush(col,id){

function emptyDay(date){return{date,mood:"",sleep:"",bias:"",levels:"",news:"",noTrade:false,noTradeReason:"",rules:{},brokenNote:"",trades:[],study:[],good:"",improve:"",lesson:"",execScore:"",media:[],links:[]}}

function isLogged(date){const d=S.days[date];return !!(d&&d.updatedAt)}
function calcR(t){const e=num(t.entry),s=num(t.sl),x=num(t.exit);if([e,s,x].some(isNaN))return null;const risk=t.dir==="Short"?s-e:e-s;if(!(risk>0))return null;return Math.round(((t.dir==="Short"?e-x:x-e)/risk)*100)/100}
function tradeR(t){const r=num(t.r);if(!isNaN(r))return r;return calcR(t)}
function dayR(d){let s=0,any=false;(d.trades||[]).forEach(t=>{const r=tradeR(t);if(r!=null){s+=r;any=true}});return any?s:null}
function brokenIds(d){return Object.entries(d.rules||{}).filter(([,v])=>v==="broken").map(([k])=>k)}
function brokenCount(d){return brokenIds(d).length}
function ruleDone(d){const ids=S.plan.rules.map(r=>r.id);const m=ids.filter(id=>d.rules&&d.rules[id]).length;return{marked:m,total:ids.length,broken:brokenCount(d)}}
function isClean(date){const d=S.days[date];if(!d||!d.updatedAt)return false;const r=ruleDone(d);return r.broken===0&&r.marked===r.total&&r.total>0}
function ruleText(id){const r=S.plan.rules.find(x=>x.id===id);return r?r.text:"Norma eliminada"}

function allTrades(from,to){const out=[];Object.keys(S.days).sort().forEach(date=>{if(from&&date<from)return;if(to&&date>to)return;const d=S.days[date];if(!d.updatedAt)return;(d.trades||[]).forEach(t=>out.push(Object.assign({date},t)))});return out}
function streak(test){let t=todayStr();if(!test(t))t=addDays(t,-1);let n=0;while(test(t)&&n<3650){n++;t=addDays(t,-1)}return n}
function metrics(trades){
  const rs=trades.map(tradeR).filter(r=>r!=null);
  const wins=rs.filter(r=>r>0),loss=rs.filter(r=>r<0);
  const total=rs.reduce((a,b)=>a+b,0);
  const gw=wins.reduce((a,b)=>a+b,0),gl=-loss.reduce((a,b)=>a+b,0);
  let worst=0,cur=0;rs.forEach(r=>{if(r<0){cur++;worst=Math.max(worst,cur)}else cur=0});
  const fp=trades.filter(t=>t.followed==="si").length,fn=trades.filter(t=>t.followed==="no").length;
  return{n:trades.length,nr:rs.length,total,exp:rs.length?total/rs.length:NaN,win:rs.length?wins.length/rs.length:NaN,pf:gl>0?gw/gl:(gw>0?Infinity:NaN),worst,
    avgW:wins.length?gw/wins.length:NaN,avgL:loss.length?gl/loss.length:NaN,followRate:(fp+fn)?fp/(fp+fn):NaN,fn}
}
function errorCosts(trades){
  const g={};trades.forEach(t=>(t.errors||[]).forEach(e=>{(g[e]=g[e]||[]).push(t)}));
  return Object.entries(g).map(([e,ts])=>{const m=metrics(ts);return{tag:e,n:ts.length,total:m.total,exp:m.exp,nr:m.nr}}).sort((a,b)=>a.total-b.total||b.n-a.n);
}

  return best;
}

const fmtNum=(v,d)=>Number(v).toLocaleString("es-ES",{maximumFractionDigits:d==null?0:d,minimumFractionDigits:d||0});
function stepState(s,M){
  if(!s.auto){const done=!!S.plan.road.done[s.id];return{done,pct:done?1:0,label:"",manual:true}}
  let val=M[s.auto],label;
  if(s.unit==="R"||s.unit==="%"){
    const m=val,n=m.nr;
    if(s.unit==="R"){val=n>=s.min&&isFinite(m.exp)?m.exp:0;label=`${isFinite(m.exp)?fmtNum(m.exp,2):"0,00"}R de ${fmtNum(s.target,2)}R · ${Math.min(n,s.min)} de ${s.min} operaciones`;
      const pct=Math.min(1,(n/s.min)*.5+(isFinite(m.exp)&&m.exp>0?Math.min(1,m.exp/s.target)*.5:0));return{done:n>=s.min&&m.exp>=s.target,pct:n>=s.min&&m.exp>=s.target?1:Math.min(.99,pct),label}}
    const f=isFinite(m.followRate)?m.followRate*100:0,cnt=m.n;
    label=`${Math.round(f)}% de ${s.target}% · ${Math.min(cnt,s.min)} de ${s.min} operaciones`;
    const done=cnt>=s.min&&f>=s.target;return{done,pct:done?1:Math.min(.99,(Math.min(1,cnt/s.min)*.5)+(Math.min(1,f/s.target)*.5)),label}
  }
  const u={h:" h",d:" días",n:"",m:" meses",ok:"","€":" €"}[s.unit]||"";
  if(s.unit==="ok")label=val>=1?"Hecho":"Pendiente";
  else label=`${fmtNum(Math.min(val,s.target),s.unit==="h"?1:0)} de ${fmtNum(s.target)}${u}`;
  const pct=Math.max(0,Math.min(1,val/s.target));
  return{done:pct>=1,pct,label};
}
function roadState(){
  const M=roadMetrics();let total=0,done=0,cur=-1;const next=[],tagTot={R:0,L:0,M:0},tagDone={R:0,L:0,M:0};
  const P=ROADMAP.map((ph,i)=>{
    const steps=ph.steps.map(s=>Object.assign({},s,stepState(s,M)));
    const dn=steps.filter(s=>s.done).length;
    steps.forEach(s=>{total++;if(s.done)done++;[...s.tags].forEach(t=>{tagTot[t]++;if(s.done)tagDone[t]++})});
    return{i,name:ph.name,when:ph.when,desc:ph.desc,steps,dn,n:steps.length,done:dn===steps.length};
  });
  P.forEach((p,i)=>{if(cur<0&&!p.done)cur=i});if(cur<0)cur=P.length-1;
  P.forEach((p,i)=>{p.cur=i===cur;if(i>=cur)p.steps.forEach(s=>{if(!s.done)next.push(Object.assign({phase:i},s))})});
  return{P,cur,total,done,next,tagTot,tagDone,M};
}

  ];
  let cur=-1;P.forEach((p,i)=>{p.done=p.goals.every(x=>x.pct>=1);if(cur<0&&!p.done)cur=i});
  if(cur<0)cur=P.length-1;P.forEach((p,i)=>p.cur=i===cur);
  return{P,cur,logStreak,cleanStreak};
}

/* ---------- semana ---------- */
function weekSummary(m){
  const end=addDays(m,6),dates=[];for(let i=0;i<7;i++)dates.push(addDays(m,i));
  const logged=dates.filter(isLogged);
  const tr=allTrades(m,end),mt=metrics(tr);
  const broken={};logged.forEach(d=>brokenIds(S.days[d]).forEach(id=>broken[id]=(broken[id]||0)+1));
  const withR=tr.map(t=>({t,r:tradeR(t)})).filter(x=>x.r!=null).sort((a,b)=>b.r-a.r);
  const exec=logged.map(d=>num(S.days[d].execScore)).filter(x=>!isNaN(x));
  const study=studyMinutes(m,end);
  return{m,end,dates,logged,tr,mt,clean:logged.filter(isClean).length,broken:Object.entries(broken).sort((a,b)=>b[1]-a[1]),
    errors:errorCosts(tr),best:withR[0]||null,worst:withR.length?withR[withR.length-1]:null,
    execAvg:exec.length?exec.reduce((a,b)=>a+b,0)/exec.length:NaN,study,lessons:logged.map(d=>[d,S.days[d].lesson]).filter(x=>x[1])};
}
const currentGoal=date=>{const w=S.weeks[addDays(mondayOf(date),-7)];return w&&w.nextGoal?w.nextGoal:""};

function planText(){

    `Mercado: ${p.market||"sin definir"} · Activos: ${p.instruments||"sin definir"} · Temporalidades: ${p.timeframe||"sin definir"} · Horario: ${p.session||"sin definir"}`,
    `Riesgo por operación: ${p.riskPct||"?"}% · Pérdida máxima diaria: ${p.maxDailyLoss||"?"} · Máximo de operaciones al día: ${p.maxTrades||"?"}`,

    `Normas:\n${p.rules.map(r=>`- [${r.cat}] ${r.text}`).join("\n")}`,
    `Consecuencia si rompo una norma: ${p.consequence||"(sin definir)"}`,
    `Playbook de setups:\n${p.playbook.map(s=>`- ${s.name}. Condiciones: ${condList(s).join("; ")||"(sin definir)"}. Entrada: ${s.entry||"-"}. Stop: ${s.stop||"-"}. Objetivo: ${s.target||"-"}. No operarlo cuando: ${s.avoid||"-"}`).join("\n")}`

}
function tradeText(t,long){
  const r=tradeR(t);
  return `  · ${t.account||"Demo"} ${t.asset||"?"} ${t.dir==="Short"?"venta":t.dir==="Long"?"compra":""} ${t.time||""} setup:${t.setup||"?"} resultado:${r!=null?fmtR(r):"sin dato"} siguió el plan:${t.followed||"?"} emoción:${t.emotion||"-"} errores:${(t.errors||[]).join(", ")||"ninguno marcado"}${t.why?` | por qué entró: ${cut(t.why,long?400:160)}`:""}${long&&t.mistakes?` | gestión/errores: ${cut(t.mistakes,300)}`:""}`;
}
function dayText(date,long){
  const d=S.days[date];if(!d||!d.updatedAt)return `${date}: sin registrar`;
  const r=dayR(d),br=brokenIds(d).map(ruleText);
  let s=`${date} (${fmtLong(date)}): ${d.noTrade?"no operó"+(d.noTradeReason?` (${cut(d.noTradeReason,150)})`:""):(d.trades.length+" operaciones")}, resultado ${r!=null?fmtR(r):"—"}, ánimo ${d.mood||"?"}/5, sueño ${d.sleep||"?"} h, nota de ejecución ${d.execScore||"?"}/10.`;
  if(br.length)s+=`\n  Normas rotas: ${br.join(" | ")}${d.brokenNote?` · Explicación: ${cut(d.brokenNote,long?300:150)}`:""}`;
  (d.trades||[]).forEach(t=>s+="\n"+tradeText(t,long));
  if(long){
    if(d.levels)s+=`\n  Plan previo: ${cut(d.levels,250)}`;
    if(d.good)s+=`\n  Hizo bien: ${cut(d.good,250)}`;
    if(d.improve)s+=`\n  A mejorar: ${cut(d.improve,250)}`;
    (d.study||[]).forEach(x=>s+=`\n  Estudio (${x.kind}, ${x.min||"?"} min): ${cut(x.title,100)}${x.notes?` — ${cut(x.notes,200)}`:""}`);
  }
  if(d.lesson)s+=`\n  Lección: ${cut(d.lesson,200)}`;
  return s;
}
function statsText(){
  const all=allTrades(),m=metrics(all),ph=phases();
  const loggedDays=Object.keys(S.days).filter(isLogged);
  const br={};loggedDays.forEach(d=>brokenIds(S.days[d]).forEach(id=>br[id]=(br[id]||0)+1));
  const errs=errorCosts(all).slice(0,5);
  return [
    `Día ${Math.max(1,diffDays(S.plan.startDate||todayStr(),todayStr())+1)} del plan (empezó el ${S.plan.startDate}). Fase actual de mi camino: ${ph.cur+1} de ${ph.P.length}, ${ph.P[ph.cur].name} (${ph.road.done} de ${ph.road.total} pasos hechos). Próximos pasos: ${ph.road.next.slice(0,3).map(s=>s.text).join(" | ")||"ninguno"}.`,
    `Racha registrando: ${ph.logStreak} días · racha sin romper normas: ${ph.cleanStreak} días · días registrados: ${loggedDays.length} · días limpios: ${loggedDays.filter(isClean).length}.`,
    `Operaciones totales: ${m.n} · resultado ${m.nr?fmtR(m.total):"—"} · expectativa ${isFinite(m.exp)?m.exp.toFixed(2)+"R":"—"} · acierto ${fmtPct(m.win)} · siguiendo el plan ${fmtPct(m.followRate)}.`,
    `Normas más rotas: ${Object.entries(br).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([id,n])=>`${ruleText(id)} (${n})`).join(" | ")||"ninguna"}.`,
    `Errores más caros: ${errs.map(e=>`${e.tag} (${e.n} veces, ${e.nr?fmtR(e.total):"sin R"})`).join(" | ")||"ninguno marcado"}.`
  ].join("\n");
}

function viewCal(){
  const [Y,M]=S.month.split("-").map(Number);
  const first=new Date(Y,M-1,1,12),days=new Date(Y,M,0).getDate(),lead=(first.getDay()+6)%7;

  let cells="";for(let i=0;i<lead;i++)cells+=`<div class="cell out" aria-hidden="true"></div>`;
  let mR=0,mTr=0,mLog=0,mClean=0,mBroken=0;
  for(let dd=1;dd<=days;dd++){
    const date=Y+"-"+pad(M)+"-"+pad(dd),d=S.days[date],logged=isLogged(date),pd=diffDays(start,date)+1;
    const r=logged?dayR(d):null,br=logged?brokenCount(d):0;
    if(logged){mLog++;mTr+=(d.trades||[]).length;if(r!=null)mR+=r;if(isClean(date))mClean++;if(br)mBroken++}

    const icons=logged?[(d.trades||[]).length?(d.trades.length+" op."):(d.noTrade?"sin operar":""),(d.media||[]).length?"📷 "+d.media.length:"",(d.study||[]).length?"estudio":""].filter(Boolean).join(" · "):"";
    cells+=`<button type="button" class="${cls}" data-act="openDay" data-date="${date}" aria-label="${esc(fmtLong(date))}">

/* ---------- estadísticas ---------- */
function equitySVG(trades){
  const rs=trades.map(tradeR).filter(r=>r!=null);
  if(rs.length<2)return `<p class="empty">La curva aparecerá cuando tengas al menos 2 operaciones con resultado.</p>`;
  let c=0;const pts=[0,...rs.map(r=>(c+=r))];
  const W=640,H=220,L=44,R=14,T=14,B=26;
  let mn=Math.min(0,...pts),mx=Math.max(0,...pts);if(mx-mn<1){mx+=.5;mn-=.5}
  const x=i=>L+(W-L-R)*i/(pts.length-1),y=v=>T+(H-T-B)*(mx-v)/(mx-mn);
  const line=pts.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const ar=line+` L${x(pts.length-1).toFixed(1)} ${y(0).toFixed(1)} L${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`;
  const last=pts[pts.length-1],ticks=[mx,(mx+mn)/2,mn].map(v=>Math.round(v*10)/10);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de resultado acumulado en R">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">${v}R</text>`).join("")}
    <line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="${ar}" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(last)}" r="4" fill="var(--accent)"/>
    <text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">Operación 1</text>
    <text x="${W-R}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">Operación ${pts.length-1} · ${fmtR(last)}</text>
  </svg></div>`;
}
function groupTable(trades,key,label,empty){
  const g={};trades.forEach(t=>{const k=t[key]||"Sin indicar";(g[k]=g[k]||[]).push(t)});
  const rows=Object.entries(g).map(([k,ts])=>[k,metrics(ts)]).sort((a,b)=>b[1].total-a[1].total);
  if(!rows.length)return `<p class="empty">${empty}</p>`;
  return `<div class="tblwrap"><table><thead><tr><th>${label}</th><th class="n">Ops.</th><th class="n">Acierto</th><th class="n">R medio</th><th class="n">R total</th></tr></thead><tbody>
  ${rows.map(([k,m])=>`<tr><td>${esc(k)}</td><td class="n">${m.n}</td><td class="n">${fmtPct(m.win)}</td><td class="n">${isFinite(m.exp)?m.exp.toFixed(2):"—"}</td><td class="n" style="color:${rcolor(m.total)}">${m.nr?fmtR(m.total):"—"}</td></tr>`).join("")}</tbody></table></div>`;
}

  let m=0;
  Object.keys(S.days).forEach(d=>{if(!isLogged(d)||(from&&d<from)||(to&&d>to))return;(S.days[d].study||[]).forEach(x=>{if(!x.learnId)m+=num(x.min)||0})});
  Object.values(S.learn).forEach(l=>{if(!l||!l.id)return;const d=l.date||"";if((from&&d<from)||(to&&d>to))return;m+=num(l.min)||0});
  return m;
}

/* ---------- velas de la cabecera ---------- */
function drawCandles(){
  const el=document.getElementById("heroCandles");if(!el||el.dataset.done)return;el.dataset.done="1";
  let seed=20261022;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const n=46,W=620,H=150,pts=[];let p=60;
  for(let i=0;i<n;i++){const o=p,c=o+(rnd()-.4)*10,hi=Math.max(o,c)+rnd()*5,lo=Math.min(o,c)-rnd()*5;pts.push({o,c,hi,lo});p=c}
  const mn=Math.min(...pts.map(x=>x.lo)),mx=Math.max(...pts.map(x=>x.hi)),y=v=>H-12-(v-mn)/(mx-mn)*(H-24),step=W/n;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMaxYMid slice">${pts.map((k,i)=>{const x=i*step+step/2,up=k.c>=k.o,col=up?"var(--win)":"var(--loss)",top=y(Math.max(k.o,k.c)),bot=y(Math.min(k.o,k.c));return `<line x1="${x}" x2="${x}" y1="${y(k.hi)}" y2="${y(k.lo)}" stroke="${col}" stroke-width="1"/><rect x="${x-step*.3}" y="${top}" width="${step*.6}" height="${Math.max(1.5,bot-top)}" rx="1" fill="${col}"/>`}).join("")}</svg>`;
}

/* ---------- archivos ---------- */
const OK_TYPES=["image/png","image/jpeg","image/gif","image/webp","video/mp4","video/webm"];
function toJpeg(file,maxSide){maxSide=maxSide||2400;return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const c=document.createElement("canvas");const k=Math.min(1,maxSide/Math.max(img.width,img.height));c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error("conv")),"image/jpeg",.88)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("conv"))};img.src=url})}
function uploadErr(name,e){const c=e&&e.code;return name+": "+(c==="too_large"?"pasa de 20 MB. Recórtalo o súbelo a YouTube/Drive y pega el enlace":c==="unsupported_type"?"formato no admitido (usa JPG, PNG, MP4 o WEBM)":c==="quota_or_state"?"no queda espacio de almacenamiento":c==="rate_limited"?"demasiadas subidas seguidas, espera un momento":e&&e.message==="conv"?"no se pudo convertir la imagen":"no se pudo subir")}
async function uploadFiles(files,scope,path){
  if(!S.assets||!files||!files.length)return;
  const date=S.date,list=[...files];let ok=0;const errs=[];
  for(let k=0;k<list.length;k++){
    const f=list[k];S.uploading=`Subiendo ${k+1} de ${list.length}…`;setStatus(S.uploading);
    try{
      let blob=f,type=f.type;const isVideo=/^video\//.test(f.type)||/\.(mov|mp4|webm|m4v)$/i.test(f.name);
      if(isVideo){if(!OK_TYPES.includes(type))type="video/mp4"}else if(!OK_TYPES.includes(type)){blob=await toJpeg(f);type="image/jpeg"}
      const r=await S.assets.upload(blob,{type});
      const root=scope==="plan"?S.plan:scope==="learn"?S.learn:getDay(date);
      if(scope==="learn"&&!S.learn[path.split(".")[0]])continue;
      getPath(root,path).push({id:r.id,type:isVideo?"video":"image",name:f.name});
      ok++;if(scope==="plan")touchPlan();else if(scope==="learn")touch("learn",path.split(".")[0]);else touchDay(date);
    }catch(e){errs.push(uploadErr(f.name,e))}
  }
  S.uploading=errs.length?errs.join(" · "):"";
  if(errs.length)setStatus(ok?`${ok} subidos, ${errs.length} con error`:"Error al subir",true);
  render();
}
async function pickImages(files,key){
  if(!files||!files.length)return;
  const max=Math.min(MAX_IMGS,(S.imgLimits&&S.imgLimits.maxCount)||MAX_IMGS);
  const list=S.pending[key]=S.pending[key]||[];
  for(const f of [...files]){
    if(list.length>=max){S.aiErr["mentor/"+key]=`Máximo ${max} imágenes por consulta: recorta la captura a la zona que importa.`;break}
    try{const blob=await toJpeg(f,1280);list.push({blob,type:"image/jpeg",name:f.name,url:URL.createObjectURL(blob)})}
    catch(e){S.aiErr["mentor/"+key]=f.name+": no se pudo leer la imagen."}
  }
  render();
}

      ${m!=="newpass"?`<label class="field"><span>Correo</span><input type="email" id="aEmail" autocomplete="email" placeholder="tu@correo.com" required></label>`:""}
      ${m!=="reset"?`<label class="field"><span>Contraseña</span><input type="password" id="aPass" autocomplete="${m==="login"?"current-password":"new-password"}" placeholder="${m==="login"?"":"Mínimo 8 caracteres"}" required></label>`:""}
      ${m==="newpass"?`<label class="field"><span>Repite la contraseña</span><input type="password" id="aPass2" autocomplete="new-password" required></label>`:""}
      ${msg?`<p class="authmsg ${err?"err":""}" role="status">${esc(msg)}</p>`:""}

  </div>`;
}
function showAuth(mode,msg,err){const el=$("#auth");el.innerHTML=authHTML(mode,msg,err);el.hidden=false;const f=el.querySelector("input");if(f)setTimeout(()=>f.focus(),30)}
function hideAuth(){$("#auth").hidden=true;$("#auth").innerHTML=""}
function authError(e){const m=String(e&&e.message||e||"");
  if(/Invalid login/i.test(m))return "Correo o contraseña incorrectos.";
  if(/Email not confirmed/i.test(m))return "Tienes que confirmar tu correo: abre el enlace que te hemos enviado.";
  if(/already registered|already exists/i.test(m))return "Ya hay una cuenta con ese correo. Prueba a entrar.";
  if(/Password should be|at least/i.test(m))return "La contraseña es demasiado corta: usa al menos 8 caracteres.";
  if(/rate limit|too many/i.test(m))return "Demasiados intentos seguidos. Espera un minuto y vuelve a probar.";
  if(/fetch|network/i.test(m))return "No hay conexión con el servidor. Revisa tu internet.";
  return "No se ha podido completar: "+m;}
function waitForLogin(initialMode){
  return new Promise(resolve=>{
    showAuth(initialMode||"login");
    const el=$("#auth");
    el.addEventListener("click",e=>{const b=e.target.closest("[data-auth]");if(b)showAuth(b.dataset.auth)});
    el.addEventListener("submit",async e=>{
      e.preventDefault();const f=e.target,mode=f.dataset.mode,btn=f.querySelector(".authgo");
      const v=id=>{const x=document.getElementById(id);return x?x.value.trim():""};
      const email=v("aEmail"),pass=document.getElementById("aPass")?document.getElementById("aPass").value:"";
      btn.disabled=true;btn.textContent="Un momento…";
      try{
        if(mode==="login"){const {data,error}=await SB.auth.signInWithPassword({email,password:pass});if(error)throw error;hideAuth();resolve(data.session)}
        else if(mode==="signup"){const name=v("aName");if(!name||!email||pass.length<8){showAuth("signup","Rellena tu nombre, tu correo y una contraseña de al menos 8 caracteres.",true);return}
          const {data,error}=await SB.auth.signUp({email,password:pass,options:{data:{name},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
          if(data.session){hideAuth();resolve(data.session)}else showAuth("login","Cuenta creada. Te hemos enviado un correo: abre el enlace para confirmarla y después entra aquí.")}
        else if(mode==="reset"){const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;showAuth("login","Si existe una cuenta con ese correo, te llegará un enlace en unos minutos.")}
        else if(mode==="newpass"){const p2=document.getElementById("aPass2").value;if(pass.length<8||pass!==p2){showAuth("newpass","Las contraseñas no coinciden o tienen menos de 8 caracteres.",true);return}
          const {error}=await SB.auth.updateUser({password:pass});if(error)throw error;const {data}=await SB.auth.getSession();hideAuth();resolve(data.session)}
      }catch(err){showAuth(mode,authError(err),true)}
    });
  });
}
async function webBoot(){
  if(!SB){showAuth("login","Falta conectar la base de datos: rellena config.js con los datos de tu proyecto de Supabase.",true);$("#auth").querySelector("form").hidden=true;return new Promise(()=>{})}
  let recovering=false;

/* ---------- guardado: misma interfaz que usaba la bitácora ---------- */
function makeDB(me){
  const store={},listeners={},docListeners={};
  const mkErr=e=>({code:/JWT|auth|permission|row-level/i.test(e&&e.message||"")?"invalid_argument":"unavailable",message:(e&&e.message)||String(e)});
  const snap=(id,data)=>({id,exists:data!==undefined,data:()=>data,metadata:{fromCache:false,hasPendingWrites:false}});
  const loaded=(async()=>{let from=0;const size=1000;for(;;){const {data,error}=await SB.from("docs").select("col,id,data").range(from,from+size-1);if(error)throw mkErr(error);data.forEach(r=>{(store[r.col]=store[r.col]||{})[r.id]=r.data});if(data.length<size)break;from+=size}})();
  const emit=(col,changes)=>(listeners[col]||[]).forEach(fn=>fn({docChanges:()=>changes,metadata:{hasPendingWrites:false}}));
  const fireDoc=(col,id)=>(docListeners[col+"/"+id]||[]).forEach(fn=>fn(snap(id,(store[col]||{})[id])));
  try{SB.channel("docs-"+me).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:`user_id=eq.${me}`},p=>{
    const row=(p.new&&p.new.col)?p.new:p.old;if(!row||!row.col||(row.user_id&&row.user_id!==me))return;
    if(p.eventType==="DELETE"){if(store[row.col])delete store[row.col][row.id];emit(row.col,[{type:"removed",doc:snap(row.id,undefined)}])}
    else{(store[row.col]=store[row.col]||{})[row.id]=p.new.data;emit(row.col,[{type:"modified",doc:snap(row.id,p.new.data)}])}
    fireDoc(row.col,row.id);
  }).subscribe()}catch(e){}
  const ref=(col,id)=>({id,path:col+"/"+id,
    async set(data){const {error}=await SB.from("docs").upsert({user_id:me,col,id,data,updated_at:new Date().toISOString()});if(error)throw mkErr(error);(store[col]=store[col]||{})[id]=data},

    <div class="stat"><span class="k">Siguiendo el plan</span><span class="v">${d.stats.follow==null?"—":Math.round(d.stats.follow*100)+"%"}</span></div></div>${sparkSVG(d.stats.equity,true)}</section>`;
  if(d.discipline)h+=`<section class="card"><div class="card-h"><h2>Disciplina</h2><span class="aside">${d.discipline.clean} días limpios de ${d.discipline.logged}</span></div>${d.discipline.broken.length?`<ul class="plainlist">${d.discipline.broken.map(([t,n])=>`<li>${esc(t)} <b class="mono">×${n}</b></li>`).join("")}</ul>`:`<p class="empty">No ha roto ninguna norma.</p>`}</section>`;
  if(d.goals&&d.goals.long.length)h+=`<section class="card"><div class="card-h"><h2>Sus metas</h2><span class="aside">${d.goals.done} de ${d.goals.total} pasos del camino</span></div><ol class="g-long">${d.goals.long.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></section>`;
  if(d.vision&&d.vision.length)h+=`<section class="card"><div class="card-h"><h2>Su tablero de sueños</h2></div><div class="gvision">${d.vision.map(v=>`<figure><img src="${esc(v.url)}" alt="${esc(v.caption||"Sueño")}" data-act="zoom" loading="lazy">${v.caption?`<figcaption>${esc(v.caption)}</figcaption>`:""}</figure>`).join("")}</div></section>`;
  if(d.trades&&d.trades.length)h+=`<section class="card"><div class="card-h"><h2>Operaciones</h2><span class="aside">${d.trades.length} últimas</span></div><div class="feed">${d.trades.map(t=>tradeFeedItem(t,uid,false)).join("")}</div></section>`;
  if(d.lessons&&d.lessons.length)h+=`<section class="card"><div class="card-h"><h2>Lo que está aprendiendo</h2></div><div class="feed">${d.lessons.map(l=>`<article class="fitem"><div class="ftrade"><b>${esc(l.title||"Lección")}</b>${l.level?`<span class="gt">${esc(l.level)}</span>`:""}${(l.tags||[]).slice(0,3).map(t=>`<span class="gt">${esc(t)}</span>`).join("")}<span class="hint">${esc([l.course,l.num?"#"+l.num:"",l.date?fmtDM(l.date):""].filter(Boolean).join(" · "))}</span></div>${l.concepts?`<p class="fnote">${esc(l.concepts)}</p>`:""}</article>`).join("")}</div></section>`;
  if(!d.streaks&&!d.stats&&!d.trades&&!d.lessons&&!d.goals&&!d.vision&&!d.discipline)h+=`<section class="card"><p class="empty">${uid===S.uid?"No compartes nada con este grupo. Actívalo en «Qué comparto».":"Este miembro no comparte nada todavía."}</p></section>`;
  return h;
}

/* ---------- cuenta ---------- */
function viewCuenta(){
  return `<section class="card"><div class="card-h"><span class="when">Tu cuenta</span><h2>${esc(myName())}</h2><span class="aside">${esc(S.email)}</span></div>
    ${fld("Tu nombre (lo verán tus grupos)",txt("displayName",S.plan.displayName||S.metaName||"","Tu nombre","data-pk",'maxlength="40"'))}
    <div class="row"><button type="button" class="btn" data-act="logout">Cerrar sesión</button></div></section>
  <section class="card"><div class="card-h"><span class="when">Tus datos</span><h2>Importar y exportar</h2></div>
    <p class="hint">Trae aquí los datos de tu bitácora anterior con el archivo que te preparé, o descarga una copia de seguridad de todo.</p>
    <div class="row"><label class="btn primary upl">Importar archivo de datos<input type="file" accept="application/json,.json" id="importFile"></label><button type="button" class="btn" data-act="exportData">Descargar copia de seguridad</button></div>
    ${S.importMsg?`<p class="hint" role="status">${esc(S.importMsg)}</p>`:""}</section>`;
}
async function importData(obj){
  const db=S.db,map={};let n=0;
  if(obj.media&&typeof obj.media==="object"){const ids=Object.keys(obj.media);for(let i=0;i<ids.length;i++){S.importMsg=`Subiendo fotos ${i+1} de ${ids.length}…`;render();try{const blob=await (await fetch(obj.media[ids[i]])).blob();const r=await S.assets.upload(blob,{type:blob.type||"image/jpeg"});map[ids[i]]=r.id}catch(e){}}}
  const fix=x=>JSON.parse(JSON.stringify(x).replace(/"id":"([0-9a-f]{32})"/g,(m,id)=>map[id]?`"id":"${map[id]}"`:m));
  const rows=[];
  if(obj.plan)rows.push({col:"config",id:"plan",data:fix(obj.plan)});
  ["days","weeks","ritual","learn","ideas","mentor"].forEach(col=>{const o=obj[col]||{};Object.keys(o).forEach(id=>rows.push({col,id,data:fix(o[id])}))});
  n=rows.length;S.importMsg=`Guardando ${n} registros…`;render();
  await db.bulk(rows);
  S.importMsg=`Listo: ${n} registros importados. Recargando…`;render();setTimeout(()=>location.reload(),1200);
}
function exportData(){
  const all=S.db.all(),out={exportedAt:new Date().toISOString(),plan:(all.config||{}).plan||S.plan};
  ["days","weeks","ritual","learn","ideas","mentor","share"].forEach(c=>out[c]=all[c]||{});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));a.download=`bitacora-copia-${todayStr()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- eventos de la capa web ---------- */
$("#main").addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  const val=id=>{const x=document.getElementById(id);return x?x.value.trim():""};
  if(a==="gCreate"){const name=val("gName");if(!name){$("#gName").focus();return}b.disabled=true;const {data,error}=await SB.rpc("create_group",{p_name:name,p_display:myName()});if(error){setStatus("No se ha podido crear el grupo: "+error.message,true);b.disabled=false;return}const row=Array.isArray(data)?data[0]:data;S.gid=row&&row.id;S.gNew=false;await loadGroups();S.gData=null;await publishAll(S.gid);setStatus("Grupo creado ✓");render()}
  else if(a==="gJoin"){const code=val("gCode");if(!code){$("#gCode").focus();return}b.disabled=true;const {data,error}=await SB.rpc("join_group",{p_code:code,p_display:myName()});if(error){setStatus(/no válido/i.test(error.message)?"Ese código no existe. Revísalo con tu amigo.":"No te has podido unir: "+error.message,true);b.disabled=false;return}S.gid=data;S.gNew=false;await loadGroups();S.gData=null;await publishAll(S.gid);setStatus("Te has unido al grupo ✓");render()}
  else if(a==="gPick"){S.gid=b.dataset.id;S.gData=null;S.gMember=null;S.confirm=null;render()}
  else if(a==="gTab"){S.gtab=b.dataset.v;render()}
  else if(a==="gNewToggle"){S.gNew=!S.gNew;render()}
  else if(a==="gRefresh"){S.gData=null;await publishAll(S.gid);render()}
  else if(a==="gMember"){S.gMember=b.dataset.u;render();window.scrollTo({top:0})}
  else if(a==="gBack"){S.gMember=null;render()}
  else if(a==="gCopy"){const code=(curGroup()||{}).code||"";try{await navigator.clipboard.writeText(code);setStatus("Código copiado ✓")}catch(err){const r=document.createRange();r.selectNodeContents($("#inviteCode"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);setStatus("Código seleccionado: cópialo")}}
  else if(a==="gLeave"){if(S.confirm!=="gleave"){S.confirm="gleave";render();return}S.confirm=null;const gid=S.gid;await SB.from("shares").delete().eq("group_id",gid).eq("user_id",S.uid);await SB.from("group_members").delete().eq("group_id",gid).eq("user_id",S.uid);S.gData=null;S.gid=null;await loadGroups();setStatus("Has salido del grupo");render()}
  else if(a==="gComment"){const key=b.dataset.u+"|"+b.dataset.r,inp=[...document.querySelectorAll("[data-cm]")].find(x=>x.dataset.cm===key),body=inp?inp.value.trim():"";if(!body){if(inp)inp.focus();return}b.disabled=true;const {data,error}=await SB.from("comments").insert({group_id:S.gid,target_user:b.dataset.u,target_ref:b.dataset.r,body}).select().single();if(error){setStatus("No se ha podido enviar el comentario",true);b.disabled=false;return}S.gData.comments.push(data);render()}
  else if(a==="gDelComment"){const id=b.dataset.id;await SB.from("comments").delete().eq("id",id);S.gData.comments=S.gData.comments.filter(c=>c.id!==id);render()}
  else if(a==="logout"){await SB.auth.signOut();location.reload()}
  else if(a==="exportData")exportData();
});
$("#main").addEventListener("change",async e=>{
  const el=e.target;
  if(el.dataset.share){const gid=S.gid,c=shareCfg(gid);c[el.dataset.share]=el.checked;S.share[gid]=c;touch("share",gid);await publishAll(gid);setStatus("Ajustes del grupo guardados ✓");render()}
  else if(el.dataset.gname){const v=el.value.trim().slice(0,40);if(!v)return;await SB.from("group_members").update({display_name:v}).eq("group_id",S.gid).eq("user_id",S.uid);await loadGroups();S.gData=null;setStatus("Nombre actualizado ✓");render()}
  else if(el.id==="importFile"&&el.files&&el.files[0]){try{const obj=JSON.parse(await el.files[0].text());await importData(obj)}catch(err){S.importMsg="Ese archivo no es una copia válida de la bitácora.";render()}}
});
$("#main").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.cm){const [u,...r]=e.target.dataset.cm.split("|");const b=[...document.querySelectorAll('[data-act="gComment"]')].find(x=>x.dataset.u===u&&x.dataset.r===r.join("|"));if(b)b.click()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.view==="grupo"&&S.gData&&Date.now()-S.gData.at>20000){S.gData.at=0;render()}});

init();
})();
</script>
