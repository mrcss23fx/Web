<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tickora</title>
<meta name="description" content="Tickora: tu diario de trading. Tus operaciones se apuntan solas desde MT5 y la app te ayuda a cumplir tu plan.">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1526" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2314213a'/%3E%3Crect x='15' y='6' width='2' height='20' fill='%23fff'/%3E%3Crect x='12' y='11' width='8' height='10' rx='2' fill='%23fbe27a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500..800&family=Inter:wght@300..700&display=swap">
<style>
:root{
  --papel:#f2f4f7;--card:#ffffff;--sub:#f7f8fb;--tinta:#14213a;--tinta2:#2a3651;--suave:#556079;--gris:#8a93a8;
  --linea:#e1e6ee;--linea2:#eef1f5;--borde:#c9d1de;--bar:#dce3f0;--seg:#e4e8ef;--dis:#a3abbb;--hatch:#dfe3ea;--weekend:#e9ecf2;
  --cobalto:#2443c7;--cobalto2:#16298a;--cobaltoC:#eef1fb;--cobaltoA:rgba(36,67,199,.14);--onAccent:#ffffff;--btn:#2443c7;
  --rot:#fbe27a;--rotC:#fdf6d8;
  --verde:#2f8f67;--verdeB:#e2f2ea;--verdeT:#1a5a40;--ambar:#b7791f;--ambarB:#fbf0da;--ambarT:#7a4f0f;--rojo:#c2412f;--rojoB:#fbe6e2;
  --mono:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--head:'Inter Tight','Inter',system-ui,sans-serif;
  --r:18px;--shadow:0 1px 2px rgba(20,33,58,.04),0 8px 24px -18px rgba(20,33,58,.25);--glow:rgba(36,67,199,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papel:#080d1a;--card:#0f1729;--sub:#0c1323;--tinta:#eef2fb;--tinta2:#c3cce0;--suave:#8b97b3;--gris:#5e6a85;
  --linea:#1b2540;--linea2:#141d33;--borde:#283553;--bar:#1b2540;--seg:#0c1323;--dis:#4a5672;--hatch:#1f2a46;--weekend:#0c1323;
  --cobalto:#4f7dff;--cobalto2:#7fa0ff;--cobaltoC:#132350;--cobaltoA:rgba(79,125,255,.20);--rot:rgba(251,226,122,.38);--rotC:#2b2717;--onAccent:#ffffff;--btn:#2d62f2;--glow:rgba(45,98,242,.20);--rotBg:linear-gradient(transparent 80%,#fbe27a 80%,#fbe27a 90%,transparent 90%);
  --verde:#4fbf8f;--verdeB:#12302a;--verdeT:#8fe0bd;--ambar:#e0a33a;--ambarB:#2f2614;--ambarT:#f0c674;--rojo:#ff7a66;--rojoB:#331a17;
  --shadow:0 1px 0 rgba(255,255,255,.02),0 20px 50px -30px rgba(0,0,0,.8);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --papel:#080d1a;--card:#0f1729;--sub:#0c1323;--tinta:#eef2fb;--tinta2:#c3cce0;--suave:#8b97b3;--gris:#5e6a85;
  --linea:#1b2540;--linea2:#141d33;--borde:#283553;--bar:#1b2540;--seg:#0c1323;--dis:#4a5672;--hatch:#1f2a46;--weekend:#0c1323;
  --cobalto:#4f7dff;--cobalto2:#7fa0ff;--cobaltoC:#132350;--cobaltoA:rgba(79,125,255,.20);--rot:rgba(251,226,122,.38);--rotC:#2b2717;--onAccent:#ffffff;--btn:#2d62f2;--glow:rgba(45,98,242,.20);--rotBg:linear-gradient(transparent 80%,#fbe27a 80%,#fbe27a 90%,transparent 90%);
  --verde:#4fbf8f;--verdeB:#12302a;--verdeT:#8fe0bd;--ambar:#e0a33a;--ambarB:#2f2614;--ambarT:#f0c674;--rojo:#ff7a66;--rojoB:#331a17;
  --shadow:0 1px 0 rgba(255,255,255,.02),0 20px 50px -30px rgba(0,0,0,.8);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv11" 1}
body{background-image:radial-gradient(900px 420px at 60% -160px,var(--glow),transparent 70%);background-repeat:no-repeat}
a{color:var(--cobalto);text-decoration:none}a:hover{color:var(--cobalto2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cobalto);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--suave);text-transform:uppercase}
.rot{padding:0 4px;background:var(--rotBg,linear-gradient(transparent 45%,var(--rot) 45%))}
h1{margin:0;font-family:var(--head);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.035em}
h2{margin:0;font-family:var(--head);font-weight:700;font-size:17px;letter-spacing:-.015em}
h3{font-family:var(--head);letter-spacing:-.015em}
.muted{color:var(--suave)}
.small{font-size:12px}
/* Ticket de Hoy */
.tk{display:flex;flex-direction:column;min-width:0}
.tk .paper{background:var(--card);border-radius:16px 16px 0 0;padding:20px 20px 12px;display:flex;flex-direction:column;gap:12px}
.tk .zig{height:14px;background:linear-gradient(135deg,var(--card) 50%,transparent 50%) 0 0/14px 14px repeat-x,linear-gradient(225deg,var(--card) 50%,transparent 50%) 0 0/14px 14px repeat-x;transform:rotate(180deg)}
.tk .cut{border-top:1.5px dashed var(--borde)}
.tkhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tkbrand{font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.18em}
.ldr{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:13px}
.ldr .dots{flex:1;min-width:12px;border-bottom:1.5px dotted var(--borde);transform:translateY(-3px)}
.ldr b{white-space:nowrap}
.tkline{display:flex;flex-direction:column;gap:3px;color:inherit;text-decoration:none}
.tkline:hover .nm{text-decoration:underline}
.tksub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--suave)}
.tkfree{font-family:var(--mono);font-size:12px;color:var(--suave);text-align:center}
.tktot{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tktot .k{font-family:var(--mono);font-size:13px;font-weight:700}
.tktot .v{font-family:var(--mono);font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tkstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-family:var(--mono)}
.tkstats div{display:flex;flex-direction:column;gap:2px}.tkstats span{font-size:10px;color:var(--suave)}.tkstats b{font-size:14px}
.stub{background:var(--card);border-radius:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-self:start;min-width:0}
.stub .a{padding:16px 20px;display:flex;flex-direction:column;gap:6px;border-right:2px dashed var(--borde);min-width:0}
.stub .b{padding:16px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:88px}
.stub .c{grid-column:1/span 2;border-top:2px dashed var(--borde);padding:12px 20px 14px;display:flex;flex-direction:column;gap:8px}
.stub .big{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:-.02em}
.stub .left{font-family:var(--mono);font-weight:700;font-size:28px;color:var(--cobalto)}
.bc{position:relative;height:62px}
.bc svg{display:block;width:100%;height:46px}
.bc .p{fill:var(--tinta)}.bc .f{fill:var(--borde)}.bc .t{fill:var(--cobalto)}.bc .n{fill:var(--tinta)}
.bc .tl{position:absolute;top:48px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;font-weight:700;color:var(--cobalto);white-space:nowrap}
.tkends{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10px;color:var(--suave)}
.tkchip{padding:4px 10px;border-radius:999px;background:var(--sub);font-size:12px}
@media (min-width:1024px){.tk .paper{padding:22px 24px 14px}.tktot .v{font-size:44px}.stub .big{font-size:32px}.stub .left{font-size:36px}.stub .a,.stub .b{padding:20px 24px}.stub .c{padding:16px 24px 18px}}
/* ---------- diseño Tickora (panel) ---------- */
.brand2{display:flex;align-items:center;gap:10px;padding:2px 8px;color:var(--tinta);text-decoration:none;font-family:var(--head);font-weight:800;font-size:17px;letter-spacing:.06em}
.brand2:hover{color:var(--tinta)}
.tlogo{width:28px;height:24px;flex:none}
.navlink{border:1px solid transparent}
.navlink[aria-current="page"]{background:var(--cobaltoC)!important;border-color:color-mix(in srgb,var(--cobalto) 55%,transparent);color:var(--tinta)!important;font-weight:600}
.navlink[aria-current="page"] svg{color:var(--cobalto)}
.themes{display:flex;gap:6px;padding:0 6px}
.acsel{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--linea);border-radius:12px;background:var(--sub);color:var(--tinta);cursor:pointer;margin:2px 0 6px}
.acsel:hover{border-color:var(--borde)}
.acsel:focus-within{outline:2px solid var(--cobalto);outline-offset:2px}
.acsel .aic{width:34px;height:34px;border-radius:10px}
.acsel-t{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.acsel-t small{font-size:11px;color:var(--suave)}
.acsel-t b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acsel>svg{color:var(--suave);flex:none}
button.acsel{font:inherit;text-align:left;width:100%}
.acsel:focus-visible{outline:2px solid var(--cobalto);outline-offset:2px}
.acsw{position:relative}
@media (min-width:1024px){.side{z-index:50}}
.acsw.mini{margin-left:auto;min-width:0}
.acsw.open .acsel{border-color:color-mix(in srgb,var(--cobalto) 60%,transparent);background:var(--cobaltoC)}
.acsw.open .acsel>svg{transform:rotate(180deg)}
.acsel>svg{transition:transform .18s ease}
.acmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:80;width:272px;max-height:min(70vh,520px);overflow:auto;padding:6px;background:var(--card);border:1px solid var(--borde);border-radius:14px;box-shadow:0 22px 48px -16px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.18);
  opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top left;transition:opacity .14s ease,transform .14s ease}
.acmenu.in{opacity:1;transform:none}
.acsw.mini .acmenu{left:auto;right:0;transform-origin:top right;width:min(300px,calc(100vw - 24px))}
.acm-h{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--suave);padding:8px 10px 6px}
.acm-sep{height:1px;background:var(--linea);margin:6px 4px}
.acm-o{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:10px;background:transparent;color:var(--tinta);font:inherit;text-align:left;cursor:pointer}
.acm-o:hover,.acm-o:focus-visible{background:var(--sub);outline:none}
.acm-o:focus-visible{box-shadow:inset 0 0 0 2px var(--cobalto)}
.acm-o[aria-selected="true"]{background:var(--cobaltoC)}
.acm-o .aic{width:34px;height:34px;border-radius:10px;flex:none}
.acm-t{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.acm-t b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acm-t small{font-size:12px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acm-dot{width:8px;height:8px;border-radius:50%;background:var(--borde);flex:none}
.acm-dot.on{background:var(--verde)}
.acm-ck{width:18px;display:flex;color:var(--cobalto2);opacity:0;flex:none}
:root:not([data-theme="dark"]) .acm-ck{color:var(--cobalto)}
.acm-o[aria-selected="true"] .acm-ck{opacity:1}
.acm-m{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;color:var(--cobalto2);font-size:13.5px;font-weight:600;text-decoration:none}
:root:not([data-theme="dark"]) .acm-m{color:var(--cobalto)}
.acm-m:hover,.acm-m:focus-visible{background:var(--sub);outline:none}
.acsel.mini{margin:0 0 0 auto;padding:4px 8px;gap:8px;max-width:min(190px,calc(100vw - 225px));min-width:0;height:38px}
.acsel.mini .aic{width:26px;height:26px;border-radius:8px}
.acsel.mini .acsel-t small{display:none}
.acsel.mini .acsel-t b{font-size:13px}
.mtop{gap:10px}
.acc2.cur{border-color:color-mix(in srgb,var(--cobalto) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--cobalto) 30%,transparent),var(--shadow)}
.themes button{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--suave);display:flex;align-items:center;justify-content:center}
.themes button[aria-pressed="true"]{color:var(--tinta);background:var(--sub)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--borde);color:var(--tinta);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 6px;text-decoration:none}
.mtop{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 14px}
.mthemebtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--linea);background:var(--card);color:var(--tinta);display:flex;align-items:center;justify-content:center}
@media (min-width:1024px){.mtop{display:none}}
.hoy3{display:grid;grid-template-columns:minmax(0,1fr) 236px 250px;gap:18px;align-items:start}
@media (max-width:1279px){.hoy3{grid-template-columns:repeat(2,minmax(0,1fr))}.hmain{grid-column:1/-1}}
@media (max-width:700px){.hoy3{grid-template-columns:1fr}.hmain{grid-column:auto}}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.greet{font-size:clamp(26px,2.6vw,32px);letter-spacing:-.03em}
.mstat{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--tinta2);text-decoration:none}
.mstat .dot{width:9px;height:9px}
.btn-an{height:46px;padding:0 22px}
.k3grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:560px){.k3grid{grid-template-columns:1fr}.btn-an{width:100%}}
.k3{position:relative;background:var(--card);border:1px solid var(--linea);border-radius:14px;padding:16px 16px 14px;min-height:124px;display:flex;flex-direction:column;gap:4px;overflow:hidden;box-shadow:var(--shadow)}
.k3t{font-weight:600;font-size:14.5px;margin-bottom:4px}
.k3s{font-size:13.5px;color:var(--tinta2)}
.k3b{font-family:var(--head);font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.k3b.acc{color:var(--cobalto2)}
:root:not([data-theme="dark"]) .k3b.acc{color:var(--cobalto)}
.k3m{flex:1}
.k3x{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;white-space:nowrap}
.k3 .k3v{position:absolute;right:12px;bottom:12px;display:flex}
.pkc .k3v{position:absolute;right:14px;display:flex}
.spk{display:block}
.flame{width:42px;height:42px;border-radius:50%;background:var(--ambarB);color:var(--ambar);display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 0 18px -4px var(--ambar)}
.h2b{font-family:var(--head);font-size:19px;font-weight:700}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{height:34px;padding:0 16px;border-radius:999px;border:1px solid var(--linea);background:transparent;color:var(--tinta2);font-size:13px}
.pills button[aria-pressed="true"]{background:var(--cobaltoC);border-color:color-mix(in srgb,var(--cobalto) 55%,transparent);color:var(--tinta);font-weight:600}
.arow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--linea);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.anum{font-family:var(--head);font-size:18px;font-weight:700;color:var(--tinta)}
.abro{font-size:14px;color:var(--tinta2);margin-top:4px}
.ast{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--ambar)}
.ast .dot{width:9px;height:9px;background:var(--ambar)}
.ast.on{color:var(--verde)}.ast.on .dot{background:var(--verde)}
.abal2{font-size:14.5px;color:var(--tinta2);display:flex;flex-direction:column;gap:4px}
.abal2 b{color:var(--tinta);font-weight:600}.abal2 b.acc{color:var(--cobalto2)}
:root:not([data-theme="dark"]) .abal2 b.acc{color:var(--cobalto)}
.amore{color:var(--suave);display:flex;padding:6px;border-radius:8px}
.amore:hover{background:var(--sub);color:var(--tinta)}
@media (max-width:640px){.arow{grid-template-columns:1fr auto}.ast{grid-column:1}.abal2{grid-column:1}.amore{grid-row:1;grid-column:2}}
.tkm{--tc:#f4f6fa;color:#14213a;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.tkm-in{background:var(--tc);padding:22px 20px 18px;display:flex;flex-direction:column;gap:9px;position:relative;
  -webkit-mask:radial-gradient(circle 6px at 50% 0,transparent 5.5px,#000 6px) top/14px 51% repeat-x,radial-gradient(circle 6px at 50% 100%,transparent 5.5px,#000 6px) bottom/14px 51% repeat-x;
  mask:radial-gradient(circle 6px at 50% 0,transparent 5.5px,#000 6px) top/14px 51% repeat-x,radial-gradient(circle 6px at 50% 100%,transparent 5.5px,#000 6px) bottom/14px 51% repeat-x}
.tkm-h{font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:.04em;text-align:center;padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid #d5dbe6}
.tl2{display:flex;justify-content:space-between;font-size:15px;color:#14213a;text-decoration:none}
.tl2 b{font-weight:500}.tl2:hover span{text-decoration:underline}
.tkm-cut{border-top:1.5px dashed #b9c2d3;margin:4px 0}
.tkm-tot{display:flex;justify-content:space-between;align-items:center}
.tkm-tot span{font-family:var(--head);font-weight:800;font-size:18px}
.tkm-tot b{font-family:var(--head);font-weight:800;font-size:22px;background:#fbe27a;padding:2px 8px;border-radius:6px;box-shadow:inset 0 -3px 0 #e8c94b}
.tkm-r{display:flex;justify-content:space-between;font-size:14px;color:#2a3651}
.tkm-ok{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;color:#14213a;margin-top:6px}
.tkm-ok svg{color:#2f8f67}.tkm-ok.bad{color:#7a4f0f}
.hcard{display:flex;flex-direction:column;gap:10px}
.hq{font-family:var(--head);font-weight:700;font-size:24px;text-align:center;letter-spacing:-.02em}
.hq span{color:#fbe27a}
:root:not([data-theme="dark"]) .hq span{color:var(--cobalto)}
.hbar{position:relative;height:8px;border-radius:999px;background:var(--linea);margin-top:4px}
.hbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--btn)}
.hbar b{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--cobalto2);transform:rotate(45deg);border-radius:2px}
.heat7{display:flex;gap:8px}
.hd7{display:grid;grid-template-rows:repeat(7,14px);gap:4px;font-size:10px;color:var(--suave);line-height:14px}
.hg7{display:flex;gap:4px;flex:1;justify-content:space-between}
.hc7{display:grid;grid-template-rows:repeat(7,14px);gap:4px}
.hc7 i,.hleg i{width:14px;height:14px;border-radius:4px;display:block}
.h0{background:var(--linea2)}.hz{background:transparent}
.hg{background:var(--cobalto);box-shadow:0 0 8px -2px var(--cobalto)}
.hb{background:var(--ambar);opacity:.85}
.hleg{display:flex;gap:12px;font-size:11.5px;color:var(--suave);flex-wrap:wrap}
.hleg span{display:inline-flex;align-items:center;gap:6px}

/* ---------- estructura ---------- */
.shell{min-height:100vh}
.side{display:none}
.main{padding:20px 20px 100px;max-width:620px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--linea);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:10}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--suave);text-decoration:none}
.tabs a[aria-current="page"]{color:var(--cobalto);font-weight:700}
.navlink{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--tinta2);text-decoration:none}
.navlink:hover{background:var(--papel);color:var(--tinta)}
.navlink[aria-current="page"]{background:var(--cobaltoC);color:var(--cobalto);font-weight:700}
.grid2{display:grid;gap:12px}
.ticker{margin:-20px -20px 12px;border-bottom:1px solid var(--linea);background:var(--card);height:46px;overflow:hidden}
@media (min-width:1024px){
  .shell{display:flex}
  .side{display:flex;width:232px;flex:none;background:var(--card);border-right:1px solid var(--linea);padding:24px 16px 20px;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;transition:width .18s ease,padding .18s ease}
  /* en Analizar el menú se recoge solo y se despliega al pasar el ratón, por encima del gráfico.
     Fluido: el menú no cambia de tamaño ni de diseño; solo se recorta (clip-path) y se anima en la GPU. */
  .side-auto{padding-left:72px}
  .side-auto .main{border-left:1px solid var(--linea)}
  .side-auto .side{position:fixed;left:0;top:0;bottom:0;z-index:60;width:232px;border-right:1px solid var(--linea);
    clip-path:inset(0 160px 0 0);will-change:clip-path;transition:clip-path .26s cubic-bezier(.22,.8,.24,1) .12s,box-shadow .26s ease .12s}
  .side-auto .side.open,.side-auto .side:has(:focus-visible),.side-auto .side:has(.acsw.open){clip-path:inset(0 -80px 0 0);box-shadow:20px 0 44px -14px rgba(0,0,0,.55);transition-delay:.05s}
  .side-auto .side .nl,.side-auto .side .brand2 span,.side-auto .side .acsel-t,.side-auto .side .acsel>svg{opacity:0;transition:opacity .18s ease .1s}
  .side-auto .side:is(.open,:has(:focus-visible),:has(.acsw.open)) :is(.nl,.brand2 span,.acsel-t,.acsel>svg){opacity:1;transition-delay:.1s}
  .side-auto .navlink,.side-auto .brand2,.side-auto .acsel{white-space:nowrap}
  .side-auto .themes{flex-direction:column;align-items:flex-start;padding:0 6px}
  .side-auto .navlink{position:relative;transition:background-color .2s ease,border-color .2s ease}
  .side-auto .acsel{transition:border-color .2s ease,background-color .2s ease}
  .side-auto .side:not(.open):not(:has(:focus-visible)):not(:has(.acsw.open)) .acsel{border-color:transparent;background:transparent}
  .side-auto .side:not(.open):not(:has(:focus-visible)):not(:has(.acsw.open)) .navlink[aria-current="page"]{background:transparent!important;border-color:transparent!important}
  .side-auto .navlink[aria-current="page"]::before{content:"";position:absolute;left:2px;top:0;bottom:0;width:36px;border-radius:10px;background:var(--cobaltoC);border:1px solid color-mix(in srgb,var(--cobalto) 55%,transparent);opacity:0;transition:opacity .2s ease;z-index:-1}
  .side-auto .side:not(.open):not(:has(:focus-visible)):not(:has(.acsw.open)) .navlink[aria-current="page"]::before{opacity:1}
  .side-auto .side nav{isolation:isolate}
  .tabs{display:none}
  .main{flex:1;min-width:0;max-width:1320px;padding:28px 32px 40px;margin:0}
  .grid2{grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
  .grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .ticker{margin:-28px -32px 16px}
  h1{font-size:32px}
}

<body>
<div id="app" aria-live="polite"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
(function(){
"use strict";
const LEGAL_VERSION="2026-10-30";
const $app=document.getElementById("app");
const SB_OK=!!(window.supabase&&window.SUPA_URL&&window.SUPA_KEY);
const sb=SB_OK?window.supabase.createClient(window.SUPA_URL,window.SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const MEDIA=(window.SUPA_URL||"").replace(/\/$/,"")+"/storage/v1/object/public/media/";
const DEFAULT_PLAN={riskPct:0.5,maxTrades:3,dayLimitR:2,start:"15:30",end:"17:30",rules:[{si:"pierdo dos seguidas,",entonces:"me levanto 15 minutos."},{si:"la entrada no está en mi estrategia,",entonces:"no entro y lo apunto."}],strategy:"",tone:"cercano"};
const S={user:null,name:"",plan:null,planDoc:null,consents:{},trades:[],bridge:null,newKey:null,loaded:false,authMode:"login",authMsg:"",authErr:"",chan:null};

/* ---------- tema ---------- */
function getThemePref(){try{return localStorage.getItem("bt-tema2")||"dark"}catch(e){return "dark"}}
function applyTheme(t){const r=document.documentElement;if(t==="light"||t==="dark")r.dataset.theme=t;else delete r.dataset.theme;try{localStorage.setItem("bt-tema2",t)}catch(e){}}
function isDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches}
const tvTheme=()=>isDark()?"dark":"light";
applyTheme(getThemePref());
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(getThemePref()==="system")refreshWidgets()});
function refreshWidgets(){const t=document.getElementById("ticker");if(t)t.dataset.theme="";if(location.hash.startsWith("#analizar")){mountTicker();if(window.TkChart)TkChart.all.forEach(x=>x.setTheme(isDark()))}}

/* ---------- utilidades ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(v,d=1)=>Number(v).toLocaleString("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtR=r=>r==null||!isFinite(r)?"—":(r>0?"+":r<0?"−":"")+num(Math.abs(r),1)+" R";
const fmtPct=p=>p==null?"—":num(p,p<1?2:1).replace(/,?0+$/,"")+" %";
const hhmm=t=>t?new Date(t).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}):"—";
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const todayKey=()=>dayKey(Date.now());
const DIAS=["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"],MESES=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const MESES_L=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fechaCorta=t=>{const d=new Date(t);return DIAS[d.getDay()]+" "+d.getDate()+" "+MESES[d.getMonth()]};
const minOf=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||"");return m?(+m[1])*60+(+m[2]):null};
const minOfDate=t=>{const d=new Date(t);return d.getHours()*60+d.getMinutes()};
const ago=t=>{const s=(Date.now()-new Date(t).getTime())/1000;if(!isFinite(s))return "";if(s<90)return "ahora mismo";if(s<3600)return "hace "+Math.round(s/60)+" min";if(s<86400)return "hace "+Math.round(s/3600)+" h";return "hace "+Math.round(s/86400)+" d"};
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
const ICON={
 hoy:'<path d="M3 18h18M7 18V9M12 18V5M17 18v-6"/>',
 progreso:'<path d="M3 17l5-5 4 3 8-8M15 7h5v5"/>',
 grupo:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
 aprender:'<path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3zM21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/>',
 plan:'<path d="M6 3h12v18l-6-4-6 4z"/>',
 cuentas:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 3.5h10M16 14.5h2"/>',
 analizar:'<path d="M7 3v4M7 15v6M17 3v6M17 15v6"/><rect x="5" y="7" width="4" height="8" rx="1"/><rect x="15" y="9" width="4" height="6" rx="1"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 down:'<path d="M5 19h14M12 5v10M8 11l4 4 4-4"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'
};
const ico=(n,s=20,w=1.8,c="currentColor")=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const NAV=[["hoy","Hoy"],["progreso","Progreso"],["grupo","Grupo"],["aprender","Aprender"],["plan","Mi plan"]];
const OSDEF=(/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)?"mac":"win");
const NAV_SIDE=[["hoy","Hoy"],["analizar","Analizar"],["progreso","Progreso"],["cuentas","Cuentas"],["grupo","Grupo"],["aprender","Aprender"],["plan","Mi plan"]];

/* ---------- plan (los cambios valen desde mañana) ---------- */
function effectivePlan(){
  const d=S.planDoc||{};
  let p=Object.assign({},DEFAULT_PLAN,d.current||{});
  if(d.pending&&d.pendingFrom&&d.pendingFrom<=todayKey())p=Object.assign(p,d.pending);
  return p;
}
async function savePlan(changes,immediate){
  const d=Object.assign({},S.planDoc||{});
  if(immediate||!d.current){d.current=Object.assign({},effectivePlan(),changes);delete d.pending;delete d.pendingFrom}
  else{
    if(d.pending&&d.pendingFrom<=todayKey()){d.current=Object.assign({},d.current,d.pending);delete d.pending}
    const t=new Date();t.setDate(t.getDate()+1);
    d.pending=Object.assign({},d.pending||{},changes);d.pendingFrom=dayKey(t);
  }
  const {error}=await sb.from("docs").upsert({user_id:S.user.id,col:"v1",id:"plan",data:d,updated_at:new Date().toISOString()});
  if(error){toast("No se pudo guardar: "+error.message);return false}
  S.planDoc=d;S.basePlan=effectivePlan();applyAcct();return true;
}

/* ---------- cómo fue cada operación ---------- */
function dayTradesOf(t){return (S.allTrades||S.trades).filter(x=>x.open_time&&String(x.account||"")===String(t.account||"")&&dayKey(x.open_time)===dayKey(t.open_time)).sort((a,b)=>new Date(a.open_time)-new Date(b.open_time))}
function evaluate(t){
  const p=planFor(t.account), day=dayTradesOf(t), idx=day.findIndex(x=>x.id===t.id);
  const before=day.slice(0,Math.max(0,idx)).reduce((s,x)=>s+(x.r||0),0);
  const c=[];
  c.push({ok:t.sl!=null,good:"Stop puesto desde la entrada",bad:"Entraste sin stop",fix:"Pon el stop al entrar, antes de nada más."});
  if(t.sl!=null)c.push({ok:!t.sl_moved,good:"No moviste el stop en contra",bad:"Moviste el stop en contra",fix:"Deja el stop donde lo pusiste: si el precio llega, la operación ya estaba pensada así."});
  if(t.risk_pct!=null)c.push({ok:t.risk_pct<=p.riskPct*1.15,good:"Riesgo el previsto: "+fmtPct(t.risk_pct),bad:"Arriesgaste "+fmtPct(t.risk_pct)+", más que tu "+fmtPct(p.riskPct),fix:"Calcula el tamaño con tu riesgo antes de entrar."});
  const s=minOf(p.start),e=minOf(p.end),m=minOfDate(t.open_time);
  if(s!=null&&e!=null)c.push({ok:m>=s&&m<=e,good:"Dentro de tu horario",bad:"Fuera de tu horario ("+p.start+"–"+p.end+")",fix:"Opera solo en tu horario; fuera de él, gráfico cerrado."});
  if(idx>=0)c.push({ok:idx<p.maxTrades,good:"Dentro de tus "+p.maxTrades+" operaciones",bad:"Operación número "+(idx+1)+": tu máximo es "+p.maxTrades,fix:"Cuando llegues a tu máximo, cierra el día."});
  if(idx>0)c.push({ok:before>-p.dayLimitR,good:"Antes de tu límite del día",bad:"Ya habías llegado a tu límite del día",fix:"Al llegar a tu límite, se acabó el día."});
  const fail=c.filter(x=>!x.ok), good=fail.length===0;
  let mejora=fail.length?fail[0].fix:null;
  if(!mejora&&!t.tp)mejora="Entraste sin objetivo puesto. Ponlo al entrar y así la salida no la decide el momento.";
  let title=t.status!=="closed"?"Abierta":good?(t.r!=null&&t.r<0?"Pérdida buena":"Buena"):"Evitable";
  return {checks:c,good,mejora,title,okCount:c.length-fail.length,total:c.length,fail};
}

/* ---------- datos ---------- */
async function loadAll(){
  const uid=S.user.id;
  const [plan,cons,trades,keys,accts]=await Promise.all([
    sb.from("docs").select("data").eq("col","v1").eq("id","plan").maybeSingle(),
    sb.from("consents").select("kind,version,granted,created_at"),
    sb.from("trades").select("*").order("open_time",{ascending:false}).limit(500),
    sb.from("bridge_keys").select("key_hash,created_at,last_seen,last_info").order("last_seen",{ascending:false,nullsFirst:false}),
    sb.from("docs").select("id,data,updated_at").eq("col","acct")
  ]);
  if(trades.error&&/relation|does not exist|schema cache/i.test(trades.error.message)){S.dbMissing=true}
  S.planDoc=plan.data?plan.data.data:null;S.basePlan=effectivePlan();S.plan=S.basePlan;
  S.consents={};(cons.data||[]).forEach(c=>{if(c.version===LEGAL_VERSION)S.consents[c.kind]=c.granted});
  S.allTrades=trades.data||[];S.bridges=keys.data||[];S.accts=(accts&&accts.data||[]).map(d=>Object.assign({id:d.id},d.data)).sort((a,b)=>(a.created||0)-(b.created||0));try{S.acctSel=localStorage.getItem("tk-acct")||""}catch(e){S.acctSel=""}applyAcct();S.loaded=true;
  drainInbox();
}
async function drainInbox(){
  if(drainInbox.busy)return;drainInbox.busy=true;
  try{
    for(let round=0;round<4;round++){
      const {data,error}=await sb.from("bridge_inbox").select("id,trade_id,kind,png_b64").order("id").limit(5);
      if(error||!data||!data.length)break;
      for(const row of data){
        try{
          const bin=atob(String(row.png_b64).replace(/\s/g,""));const bytes=new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
          const safe=row.trade_id.replace(/[^a-zA-Z0-9_-]/g,"-");
          const path=`${S.user.id}/capturas/${safe}-${row.kind}-${Math.random().toString(36).slice(2,10)}.png`;
          const up=await sb.storage.from("media").upload(path,new Blob([bytes],{type:"image/png"}),{contentType:"image/png",upsert:false});
          if(up.error)throw up.error;
          const col=row.kind==="entry"?"capture_entry":"capture_exit";
          await sb.from("trades").update({[col]:path}).eq("id",row.trade_id);
          await sb.from("bridge_inbox").delete().eq("id",row.id);
          const t=S.trades.find(x=>x.id===row.trade_id);if(t)t[col]=path;
        }catch(e){console.warn("captura",e);await sb.from("bridge_inbox").delete().eq("id",row.id)}
      }
      render();
    }
  }finally{drainInbox.busy=false}
}
function subscribe(){
  if(S.chan||!sb)return;
  S.chan=sb.channel("trades-"+S.user.id).on("postgres_changes",{event:"*",schema:"public",table:"trades",filter:"user_id=eq."+S.user.id},payload=>{
    const row=payload.new;if(!row||!row.id)return;
    const T=S.allTrades,i=T.findIndex(x=>x.id===row.id);
    if(i>=0)T[i]=Object.assign(T[i],row);else T.unshift(row);
    T.sort((a,b)=>new Date(b.open_time)-new Date(a.open_time));applyAcct();
    if(payload.eventType==="INSERT")toast(row.symbol+": operación apuntada");
    render();setTimeout(drainInbox,1500);
  }).subscribe();
}

/* ---------- piezas visuales ---------- */
function vela(r,h=36){
  const mid=h/2, len=r==null?2:Math.max(3,Math.min(mid-2,Math.abs(r)*7));
  const top=r==null?mid-1:r>=0?mid-len:mid+1;
  return `<div class="vela" style="height:${h}px" aria-hidden="true"><div style="position:absolute;left:0;top:${mid}px;width:12px;height:1px;background:var(--gris)"></div><div style="position:absolute;left:3px;top:${top}px;width:6px;height:${len}px;border-radius:2px;background:var(--tinta)"></div></div>`;
}
function regla(trades,dayR,limit){
  const x=r=>Math.max(1,Math.min(99,(r+2.5)/5*100));
  const wall=x(-limit);
  let h=`<div class="regla" role="img" aria-label="Regla de R: tu límite está en −${num(limit,1)} R y el día va en ${fmtR(dayR)}">`;
  h+=`<div style="position:absolute;left:0;top:24px;width:${wall}%;height:30px;background:repeating-linear-gradient(135deg,var(--linea) 0 4px,var(--card) 4px 8px);border-right:2px solid var(--tinta)"></div>`;
  h+=`<div style="position:absolute;left:0;top:54px;width:100%;height:1px;background:var(--gris)"></div>`;
  h+=`<div class="lbl" style="position:absolute;left:4px;top:8px;font-size:9px">Límite −${num(limit,1)} R</div>`;
  [-2,-1,0,1,2].forEach(r=>{h+=`<div style="position:absolute;left:${x(r)}%;top:${r?49:47}px;width:${r?1:2}px;height:${r?10:14}px;background:${r?"var(--gris)":"var(--tinta)"}"></div><span class="mono" style="position:absolute;left:calc(${x(r)}% - 7px);top:66px;font-size:10px;color:${r?"var(--suave)":"var(--tinta)"};font-weight:${r?400:700}">${r>0?"+":r<0?"−":""}${Math.abs(r)}</span>`});
  trades.filter(t=>t.r!=null).forEach(t=>{h+=`<div title="${esc(t.symbol)} ${fmtR(t.r)}" style="position:absolute;left:calc(${x(t.r)}% - 6px);top:36px;width:12px;height:12px;border-radius:50%;background:var(--tinta)"></div><div class="mono" style="position:absolute;left:calc(${x(t.r)}% - 26px);width:52px;text-align:center;top:20px;font-size:9px;color:var(--suave)">${esc(t.symbol.slice(0,8))}</div>`});
  h+=`<div style="position:absolute;left:calc(${x(dayR)}% - 7px);top:26px;width:14px;display:flex;flex-direction:column;align-items:center"><div style="width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--cobalto)"></div><div style="width:2px;height:19px;background:var(--cobalto)"></div></div><div class="mono" style="position:absolute;left:calc(${x(dayR)}% - 12px);top:8px;font-size:10px;font-weight:700;color:var(--cobalto)">HOY</div>`;
  return h+"</div>";
}
function franja(trades,plan){
  const X=m=>Math.max(0,Math.min(100,(m-480)/(15*60)*100));
  const now=minOfDate(Date.now()), s=minOf(plan.start)||930, e=minOf(plan.end)||1050;
  let h=`<div class="franja" role="img" aria-label="Franja del día de 8 a 23 h con Londres, Nueva York, tu horario de ${esc(plan.start)} a ${esc(plan.end)} y tus operaciones">`;
  h+=`<div style="position:absolute;left:${X(540)}%;width:${X(1050)-X(540)}%;top:4px;height:13px;border-radius:4px;background:var(--bar)"></div><div style="position:absolute;left:calc(${X(540)}% + 5px);top:4px;font-size:9px;line-height:13px;color:var(--suave)">Londres</div>`;
  h+=`<div style="position:absolute;left:${X(930)}%;width:${X(1320)-X(930)}%;top:22px;height:13px;border-radius:4px;background:var(--bar)"></div><div style="position:absolute;left:calc(${X(1060)}% + 5px);top:22px;font-size:9px;line-height:13px;color:var(--suave)">Nueva York</div>`;
  h+=`<div style="position:absolute;left:${X(s)}%;width:${Math.max(1,X(e)-X(s))}%;top:0;height:39px;border-radius:7px;background:var(--cobaltoA);border:1.5px solid var(--cobalto)"></div>`;
  trades.forEach(t=>{h+=`<div style="position:absolute;left:${X(minOfDate(t.open_time))}%;top:39px;width:2px;height:7px;background:var(--cobalto)"></div>`});
  if(now>=480&&now<=1380)h+=`<div style="position:absolute;left:${X(now)}%;top:-4px;width:2px;height:47px;background:var(--tinta)"></div>`;
  h+=`</div><div style="position:relative;height:14px">`;
  [8,12,16,20,23].forEach(hh=>{h+=`<span class="mono" style="position:absolute;left:calc(${X(hh*60)}% - ${hh===23?16:0}px);font-size:9px;color:var(--suave)">${String(hh).padStart(2,"0")}</span>`});
  return h+`</div>`;
}
const dur=x=>Math.floor(x/60)+":"+String(x%60).padStart(2,"0");
function ticketDia(today,dayR,p){
  let ok=0,tot=0;
  const lines=today.map(t=>{
    const ev=evaluate(t), closed=t.status==="closed";
    if(closed){ok+=ev.okCount;tot+=ev.total}
    const times=hhmm(t.open_time)+(t.close_time?" → "+hhmm(t.close_time):" · abierta");
    let sub=times, icon="";
    if(closed){
      if(ev.fail.length){sub+=" · "+ev.fail.length+" norma"+(ev.fail.length>1?"s":"")+" sin cumplir";icon=ico("x",14,2.4,"var(--ambarT)")}
      else{sub+=" · "+(t.r!=null&&t.r<0?"pérdida buena":"dentro del pacto");
        if(!t.tp){sub+=" · a mejorar: pon objetivo";icon=`<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 3 V8 M7 10.6 V11" fill="none" stroke="var(--ambarT)" stroke-width="2.2" stroke-linecap="round"/></svg>`}
        else icon=ico("check",14,2.6,"var(--cobalto)")}
    }
    return `<a class="tkline" href="#op/${encodeURIComponent(t.id)}"><div class="ldr"><span class="nm">${hhmm(t.open_time)} ${esc((t.symbol||"").toUpperCase())} ${t.side==="buy"?"COMPRA":"VENTA"}</span><span class="dots"></span><b>${closed?fmtR(t.r):"abierta"}</b></div><div class="tksub">${icon}<span>${esc(sub)}</span></div></a>`;
  }).join("");
  const n=p.maxTrades-today.length;
  const free=n>0?`— queda${n>1?"n":""} ${n} operaci${n>1?"ones libres":"ón libre"} —`:n===0?"— has llegado a tu máximo —":`— ${-n} por encima de tu máximo —`;
  const margin=Math.max(0,p.dayLimitR+dayR);
  return `<div class="tk"><div class="paper">
    <div class="tkhead"><span class="tkbrand">TICKORA</span><span class="lbl">Tu día en R · ${today.length} de ${p.maxTrades}</span></div>
    <div class="cut"></div>

function tradeStats(list){
  const L=list.filter(t=>t.status==="closed"&&t.r!=null);
  const w=L.filter(t=>t.r>0),l=L.filter(t=>t.r<0);
  const sw=w.reduce((a,t)=>a+t.r,0),sl=l.reduce((a,t)=>a+t.r,0),tot=sw+sl;
  let cum=0,peak=0,dd=0;const curve=[0];
  L.slice().sort((a,b)=>new Date(a.open_time)-new Date(b.open_time)).forEach(t=>{cum+=t.r;curve.push(cum);peak=Math.max(peak,cum);dd=Math.min(dd,cum-peak)});
  return {n:L.length,win:L.length?w.length/L.length*100:null,avgW:w.length?sw/w.length:null,avgL:l.length?sl/l.length:null,exp:L.length?tot/L.length:null,pf:l.length?sw/Math.abs(sl):(w.length?Infinity:null),tot,dd,curve};
}

function calcEntry(){
  const a=S.an, info=symbolsInfo().find(x=>x.s===a.sym), p=S.plan;
  const n=v=>{const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:null};
  const e=n(a.entry),s=n(a.stop),t=n(a.tp), bal=S.bridge&&S.bridge.last_info&&+S.bridge.last_info.balance||null;
  const cur=(S.bridge&&S.bridge.last_info&&S.bridge.last_info.currency)||"€";
  const out={ok:false,msg:"",lots:null,riskPct:null,rr:null};
  if(e==null||s==null){out.msg="Escribe la entrada y el stop.";return out}
  const dirOk=a.side==="buy"?s<e&&(t==null||t>e):s>e&&(t==null||t<e);
  if(!dirOk){out.msg=a.side==="buy"?"En una compra el stop va por debajo de la entrada y el objetivo por encima.":"En una venta el stop va por encima de la entrada y el objetivo por debajo.";return out}
  out.rr=t!=null?Math.abs(t-e)/Math.abs(e-s):null;
  if(!info||!bal){out.msg=!info?"Para calcular el tamaño, ten este mercado en la Observación de mercado de MT5 (el programa puente envía sus datos cada 5 minutos).":"Falta el saldo de tu cuenta: llegará con la próxima señal del programa puente.";return out}
  const riskMoney=bal*p.riskPct/100, lossPerLot=Math.abs(e-s)/info.ts*info.tv;
  let lots=Math.floor((riskMoney/lossPerLot)/info.vstep+1e-9)*info.vstep;
  if(info.vmax)lots=Math.min(lots,info.vmax);
  if(lots<info.vmin){out.msg=`El stop está demasiado lejos para tu riesgo: ni el mínimo de ${num(info.vmin,2)} lotes cabe en tu ${fmtPct(p.riskPct)}.`;out.tooFar=true;return out}
  out.ok=true;out.lots=lots;out.riskPct=lots*lossPerLot/bal*100;out.riskMoney=lots*lossPerLot;out.cur=cur;return out;
}

/* Precios en vivo de tu MT5 (programa puente 1.3 o más nuevo) */
function mt5Live(sym){
  const b=S.bridge, info=b&&b.last_info||{}, v=parseFloat(info.version||"0");
  const recent=b&&b.last_seen&&(Date.now()-new Date(b.last_seen))<10*60*1000;
  return !!(recent&&v>=1.3&&symbolsInfo().some(x=>x.s===sym));
}
function mt5Provider(sym){
  const info=symbolsInfo().find(x=>x.s===sym), d=info&&info.d!=null?info.d:5;
  const pub=TkChart.sources.publico((n,body)=>sb.functions.invoke(n,{body}),d);
  const toBar=a=>({timestamp:a[0],open:+a[1],high:+a[2],low:+a[3],close:+a[4],volume:+a[5]||0});
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  let off=false;
  const ver=parseFloat((S.bridge&&S.bridge.last_info&&S.bridge.last_info.version)||"0");
  const okTf=tf=>!["30m","1w"].includes(tf)||ver>=1.31;   // 30 min y semanal llegan con el programa 1.31
  return {
    id:"mt5", get label(){return off?"MT5 no responde · precio público":"Tu MT5 · en vivo"},
    async bars(s,tf,to){
      if(off||!okTf(tf))return pub.bars(s,tf,to);
      const req=Math.random().toString(36).slice(2,10);
      const {error}=await sb.rpc("bridge_watch_set",{p_sym:s,p_tf:tf,p_req:req,p_to:to||null,p_n:1000});
      if(!error){
        const t0=Date.now();
        while(Date.now()-t0<9000){
          await wait(600);
          const {data}=await sb.from("bridge_hist").select("req,bars").maybeSingle();
          if(data&&data.req===req){const bars=(data.bars||[]).map(toBar).filter(x=>!to||x.timestamp<to);return {bars,more:(data.bars||[]).length>=900}}
        }
      }
      off=true;return pub.bars(s,tf,to);   // MT5 cerrado o sin responder: seguimos con el precio público
    },
    subscribe(s,tf,cb){
      if(off||!okTf(tf))return pub.subscribe(s,tf,cb);
      const hb=setInterval(()=>sb.rpc("bridge_watch_set",{p_sym:s,p_tf:tf}),20000);
      const ch=sb.channel("live-"+S.user.id+"-"+Date.now()).on("postgres_changes",{event:"*",schema:"public",table:"bridge_live",filter:"user_id=eq."+S.user.id},p=>{const r=p.new;if(!r||r.sym!==s||r.tf!==tf)return;(r.bars||[]).forEach(a=>cb(toBar(a)))}).subscribe();
      return ()=>{clearInterval(hb);sb.removeChannel(ch)};
    }
  };
}
function chartOpts(i){
  const L=layState(),main=i===0;
  return {
    key:main?"main":"p"+i, sym:main?S.an.sym:(L.syms[i]||"EURUSD"), dark:isDark(),

    symbols:()=>{const mine=symbolsInfo().map(x=>x.s);return (mine.length?[["Tu MT5",mine]]:[]).concat(MARKETS.map(([g,l])=>[g,l.filter(x=>!mine.includes(x))])).filter(g=>g[1].length)},

    saveSim:async rec=>{const {error}=await sb.from("sim_trades").insert(Object.assign({user_id:S.user.id},rec));if(error)toast("No se pudo guardar la simulada")}
  };
}

/* ---------- render y eventos ---------- */
function route(){const h=location.hash.replace(/^#/,"");if(h.startsWith("op/"))return {view:"op",id:decodeURIComponent(h.slice(3))};const v=h||"hoy";return {view:NAV_SIDE.some(n=>n[0]===v)?v:"hoy"}}
function render(){
  if(!SB_OK){$app.innerHTML=`<div class="auth"><div class="card authcard">Falta configurar la conexión (config.js).</div></div>`;return}
  if(!S.user){$app.innerHTML=viewAuth();bindAuth();return}
  if(!S.loaded){$app.innerHTML=`<div class="auth"><div class="muted">Cargando Tickora…</div></div>`;return}
  if(!(S.consents.adult&&S.consents.risk&&S.consents.privacy)){$app.innerHTML=viewConsent();bindConsent();return}
  const r=route(), key=r.view+(r.id||""), ae=document.activeElement;
  if(S.lastView===key&&ae&&ae.closest&&ae.closest("#main")&&ae.matches("input,textarea,select"))return; // no borrar lo que estás escribiendo
  if(key==="analizar"&&S.lastView==="analizar"&&document.getElementById("tkchart")){paintAnalizar();return} // no recargar el gráfico
  S.lastView=key;
  if(r.view!=="analizar"&&window.TkChart&&TkChart.current){TkChart.destroy();document.body.style.overflow=""}
  const content=r.view==="op"?viewOp(r.id):r.view==="analizar"?viewAnalizar():r.view==="progreso"?viewProgreso():r.view==="plan"?viewPlan():r.view==="cuentas"?viewCuentas():
    r.view==="grupo"?viewSoon("Grupo","Los grupos nuevos, donde solo se comparte disciplina y nunca dinero, llegan en el último paso de esta versión. Mientras tanto, tus grupos siguen en la versión anterior."):
    r.view==="aprender"?viewSoon("Aprender","Las lecciones llegarán cuando termines el bootcamp. Tus apuntes siguen en la versión anterior."):viewHoy();
  $app.innerHTML=shell(r.view==="op"?"hoy":r.view,content);
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>{applyTheme(b.dataset.themeSet);document.querySelectorAll("[data-theme-set]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.themeSet===b.dataset.themeSet)));refreshWidgets()});
  document.querySelectorAll("[data-theme-toggle]").forEach(b=>b.onclick=()=>{applyTheme(isDark()?"light":"dark");refreshWidgets()});
  bindAcctMenus();
  const sd=document.querySelector(".side-auto .side");
  if(sd){let t=null;
    const arm=()=>{if(t||sd.classList.contains("open"))return;t=setTimeout(()=>{t=null;sd.classList.add("open")},150)};
    sd.addEventListener("pointerenter",e=>{if(e.pointerType!=="touch")arm()});
    sd.addEventListener("pointermove",e=>{if(e.pointerType!=="touch")arm()});
    sd.addEventListener("pointerleave",()=>{clearTimeout(t);t=null;if(sd.querySelector(".acsw.open"))return;sd.classList.remove("open")});
  }
  document.querySelectorAll("[data-acct-all]").forEach(b=>b.onclick=()=>setAcct(""));
  document.querySelectorAll("[data-ause]").forEach(b=>b.onclick=()=>setAcct(b.dataset.ause));
  bindView(r);
}
function bindAuth(){
  const f=document.getElementById("authForm");
  f.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.authMode=b.dataset.mode;S.authErr=S.authMsg="";render()});
  f.onsubmit=async e=>{
    e.preventDefault();S.authErr=S.authMsg="";
    const v=id=>{const el=document.getElementById(id);return el?el.value.trim():""};
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;
    try{
      if(S.authMode==="login"){const {error}=await sb.auth.signInWithPassword({email:v("aEmail"),password:document.getElementById("aPass").value});if(error)throw error}
      else if(S.authMode==="signup"){
        if(document.getElementById("aPass").value.length<8)throw new Error("La contraseña necesita al menos 8 caracteres.");
        const {data,error}=await sb.auth.signUp({email:v("aEmail"),password:document.getElementById("aPass").value,options:{data:{name:v("aName")},emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;if(!data.session){S.authMode="login";S.authMsg="Te hemos enviado un correo para confirmar tu cuenta."}
      }else if(S.authMode==="reset"){const {error}=await sb.auth.resetPasswordForEmail(v("aEmail"),{redirectTo:location.origin+location.pathname});if(error)throw error;S.authMsg="Revisa tu correo: te hemos enviado el enlace."}
      else if(S.authMode==="newpass"){const {error}=await sb.auth.updateUser({password:document.getElementById("aPass").value});if(error)throw error;S.authMode="login";toast("Contraseña cambiada")}
    }catch(err){S.authErr=traducir(err.message)}
    btn.disabled=false;if(!S.user)render();
  };
}
function traducir(m){m=String(m||"");if(/Invalid login/i.test(m))return "Correo o contraseña incorrectos.";if(/Email not confirmed/i.test(m))return "Confirma tu correo antes de entrar (revisa la bandeja de entrada).";if(/already registered/i.test(m))return "Ya hay una cuenta con ese correo.";if(/rate limit/i.test(m))return "Demasiados intentos. Espera unos minutos.";return m}
function bindConsent(){
  const f=document.getElementById("consentForm");
  document.getElementById("consentOut").onclick=()=>sb.auth.signOut();
  f.onsubmit=async e=>{
    e.preventDefault();const err=document.getElementById("consentErr");
    if(!f.adult.checked||!f.risk.checked||!f.privacy.checked){err.textContent="Marca las tres primeras casillas para continuar.";err.hidden=false;return}
    const rows=["adult","risk","privacy","health"].map(k=>({user_id:S.user.id,kind:k,version:LEGAL_VERSION,granted:!!f[k].checked}));
    const {error}=await sb.from("consents").upsert(rows);
    if(error){err.textContent="No se pudo guardar: "+error.message+(/relation|schema cache/.test(error.message)?" (falta pegar supabase-v1.sql en Supabase)":"");err.hidden=false;return}
    rows.forEach(r=>S.consents[r.kind]=r.granted);
    if(!S.planDoc||!S.planDoc.current)await savePlan({},true);
    location.hash="#plan";render();
  };
}

      document.getElementById("acctCancel").onclick=()=>{S.acctEdit=null;S.lastView=null;render()};
      f.onsubmit=async e=>{e.preventDefault();
        const fd=new FormData(f),d={};for(const [k,v] of fd.entries())if(!k.startsWith("g_"))d[k]=String(v).trim();
        const G=n=>fd.getAll(n).map(v=>String(v).trim());const gv=G("g_value");
        d.goals=gv.map((v,i)=>({label:G("g_label")[i],metric:G("g_metric")[i],dir:G("g_dir")[i],value:nOr(v),period:G("g_period")[i]})).filter(g=>g.value!=null);
        if(gv.some(v=>v&&nOr(v)==null)){toast("Revisa el valor de tus metas");return}
        const prev=typeof S.acctEdit==="string"&&S.acctEdit!=="new"?(S.accts||[]).find(x=>x.id===S.acctEdit):null;
        if(d.type!=="fondeo")delete d.phase;

        if(d.number&&(S.accts||[]).some(x=>x.id!==(prev&&prev.id)&&String(x.number)===d.number)){toast("Ya tienes una cuenta con ese número");return}

        const {error}=await sb.from("docs").upsert({user_id:S.user.id,col:"acct",id,data:d,updated_at:new Date().toISOString()});

        if(error){toast("No se pudo guardar: "+error.message);return}
        S.accts=(S.accts||[]).filter(x=>x.id!==id).concat([Object.assign({id},d)]).sort((a,b)=>(a.created||0)-(b.created||0));

  if(r.view==="analizar"){

    prefill();
    document.getElementById("anSym").onchange=e=>{a.sym=e.target.value;a.entry="";a.stop="";a.tp="";["anEntry","anStop","anTp"].forEach(id=>document.getElementById(id).value="");prefill();if(window.TkChart){const m=TkChart.all.find(x=>x.key==="main");if(m)m.setSymbol(a.sym)}document.querySelectorAll("[data-mkt]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.mkt===a.sym)));paintAnalizar()};
    [["anEntry","entry"],["anStop","stop"],["anTp","tp"]].forEach(([id,k])=>document.getElementById(id).oninput=e=>{a[k]=e.target.value;paintAnalizar()});
    document.querySelectorAll("[data-side]").forEach(b=>b.onclick=()=>{a.side=b.dataset.side;document.querySelectorAll("[data-side]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.side===a.side)));paintAnalizar()});
    document.querySelectorAll("[data-mkt]").forEach(b=>b.onclick=()=>{a.sym=b.dataset.mkt;a.entry="";a.stop="";a.tp="";S.lastView=null;render()});

    document.querySelectorAll("[data-feel]").forEach(b=>b.onclick=()=>{const f=b.dataset.feel;saveReview({feel:(t.review||{}).feel===f?null:f});document.querySelectorAll("[data-feel]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.feel===(t.review||{}).feel)))});

    document.getElementById("addRule").onclick=()=>{const p=S.plan;p.rules=readRules().concat([{si:"",entonces:""}]);render()};
    f.onsubmit=async e=>{

      if(!(ch.riskPct>0)||!(ch.maxTrades>0)||!(ch.dayLimitR>0)||minOf(ch.start)==null||minOf(ch.end)==null||minOf(ch.start)>=minOf(ch.end)){toast("Revisa los números y el horario");return}
      const first=!(S.planDoc&&S.planDoc.current&&S.planDoc.saved);

async function onSession(session,event){
  if(event==="PASSWORD_RECOVERY"){S.user=null;S.authMode="newpass";render();return}
  const u=session&&session.user;
  if(!u){S.user=null;S.loaded=false;if(S.chan){sb.removeChannel(S.chan);S.chan=null}render();return}
  if(S.user&&S.user.id===u.id)return;
  S.user=u;S.name=(u.user_metadata&&u.user_metadata.name)||(u.email||"").split("@")[0]||"Trader";S.loaded=false;render();
  await loadAll();subscribe();render();
}

  sb.auth.onAuthStateChange((event,session)=>{setTimeout(()=>onSession(session,event),0)});
  sb.auth.getSession().then(({data})=>onSession(data.session,"INIT"));
}else render();
})();
</script>
</body>
</html>
