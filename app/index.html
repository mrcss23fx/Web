<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitácora</title>
<meta name="description" content="Tu bitácora de trading: tus operaciones se apuntan solas desde MT5 y la app te ayuda a cumplir tu plan.">
<meta name="theme-color" content="#f2f4f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2314213a'/%3E%3Crect x='15' y='6' width='2' height='20' fill='%23fff'/%3E%3Crect x='12' y='11' width='8' height='10' rx='2' fill='%23fbe27a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&family=Martian+Mono:wdth,wght@75..112.5,400..700&display=swap">
<style>
:root{
  --papel:#f2f4f7;--card:#fff;--tinta:#14213a;--tinta2:#2a3651;--suave:#556079;--linea:#e1e6ee;--borde:#c9d1de;--gris:#8a93a8;
  --cobalto:#2443c7;--cobalto2:#16298a;--cobaltoC:#eef1fb;--rot:#fbe27a;--rotC:#fdf6d8;
  --verde:#2f8f67;--verdeB:#e2f2ea;--verdeT:#1a5a40;--ambar:#b7791f;--ambarB:#fbf0da;--ambarT:#7a4f0f;--rojo:#c2412f;--rojoB:#fbe6e2;
  --mono:'Martian Mono',ui-monospace,monospace;--sans:'Geologica','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--cobalto)}a:hover{color:var(--cobalto2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cobalto);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-stretch:87.5%;font-size:10px;letter-spacing:.08em;color:var(--suave);text-transform:uppercase}
.rot{padding:0 4px;background:linear-gradient(transparent 45%,var(--rot) 45%)}
h1{margin:0;font-weight:800;font-size:28px;line-height:1.08;letter-spacing:-.02em}
h2{margin:0;font-weight:700;font-size:16px}
.muted{color:var(--suave)}
.small{font-size:12px}
.card{background:var(--card);border-radius:18px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.btn{height:50px;border:0;border-radius:15px;background:var(--cobalto);color:#fff;font-weight:700;font-size:15px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--cobalto2);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn2{height:44px;border:1px solid var(--borde);border-radius:13px;background:#fff;color:var(--cobalto);font-weight:600;font-size:14px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn2:hover{border-color:var(--cobalto)}
.link{background:none;border:0;padding:0;color:var(--cobalto);font-weight:600;font-size:13px}
.chip{font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--borde);background:#fff}
.chip[aria-pressed="true"]{background:var(--cobalto);border-color:var(--cobalto);color:#fff;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:600;font-size:13px}
.input{height:46px;border:1px solid var(--borde);border-radius:12px;background:#fff;padding:0 12px;font-size:15px;width:100%}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.45}
.input:focus{border-color:var(--cobalto);outline:none;box-shadow:0 0 0 3px rgba(36,67,199,.15)}
.err{color:var(--rojo);font-size:13px}
.ok{color:var(--verdeT);font-size:13px}
.sello{display:inline-block;transform:rotate(-2deg);border:1.5px dashed var(--cobalto);border-radius:8px;padding:4px 9px;font-family:var(--mono);font-stretch:87.5%;font-size:10px;letter-spacing:.06em;font-weight:700;color:var(--cobalto)}
.si{display:grid;grid-template-columns:26px minmax(0,1fr);gap:3px 8px;align-items:baseline;font-size:13px}
.si b{font-family:var(--mono);font-size:10px;color:var(--cobalto)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check svg{flex:none;margin-top:1px}
.callout{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 8px;padding:10px 12px;border-radius:12px;background:var(--rotC);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ---------- estructura ---------- */
.shell{min-height:100vh}
.side{display:none}
.main{padding:20px 20px 100px;max-width:560px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(70px + env(safe-area-inset-bottom,0px));padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--linea);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:10}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--suave);text-decoration:none}
.tabs a[aria-current="page"]{color:var(--cobalto);font-weight:700}
.navlink{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--tinta2);text-decoration:none}
.navlink[aria-current="page"]{background:var(--cobaltoC);color:var(--cobalto);font-weight:700}
.grid2{display:grid;gap:12px}
@media (min-width:1024px){
  .shell{display:flex}
  .side{display:flex;width:232px;flex:none;background:#fff;border-right:1px solid var(--linea);padding:24px 16px 20px;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
  .tabs{display:none}
  .main{flex:1;min-width:0;max-width:1180px;padding:28px 32px 40px;margin:0}
  .grid2{grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
  .grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
  h1{font-size:32px}
}

/* ---------- piezas ---------- */
.regla{position:relative;height:84px}
.franja{position:relative;height:46px}
.thumb{border-radius:10px;background:#f7f8fb;border:1px solid var(--linea);overflow:hidden;display:block}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.op{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linea);text-decoration:none;color:inherit}
.op:last-child{border-bottom:0}
.op:hover .opname{color:var(--cobalto)}
.vela{position:relative;width:12px;height:36px;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal div{height:40px;border-radius:9px;font-family:var(--mono);font-size:11px;padding:5px 7px}
.toggle{position:relative;width:46px;height:28px;border-radius:999px;border:0;background:var(--borde);flex:none;padding:0}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-checked="true"]{background:var(--cobalto)}
.toggle[aria-checked="true"]::after{left:21px}
.tvcard{height:calc(100vh - 150px);min-height:520px}
@media (max-width:1023px){.tvcard{height:calc(100vh - 210px);min-height:460px}}
.tvwrap{height:100%!important}
.tvwrap iframe{height:calc(100% - 32px)!important;min-height:400px}
.tvcard.full{position:fixed;inset:0;z-index:40;border-radius:0;height:100vh;min-height:0}
.keybox{font-family:var(--mono);font-size:12px;word-break:break-all;background:#f7f8fb;border:1px dashed var(--cobalto);border-radius:10px;padding:10px 12px}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.authcard{width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--tinta);position:relative;flex:none}
.logo::before{content:"";position:absolute;left:14px;top:6px;width:2px;height:18px;background:#fff}
.logo::after{content:"";position:absolute;left:11px;top:10px;width:8px;height:9px;border-radius:2px;background:var(--rot)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (min-width:1024px){.toast{bottom:28px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
(function(){
"use strict";
const LEGAL_VERSION="2026-10-30";
const $app=document.getElementById("app");
const SB_OK=!!(window.supabase&&window.SUPA_URL&&window.SUPA_KEY);
const sb=SB_OK?window.supabase.createClient(window.SUPA_URL,window.SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const MEDIA=(window.SUPA_URL||"").replace(/\/$/,"")+"/storage/v1/object/public/media/";
const DEFAULT_PLAN={riskPct:0.5,maxTrades:3,dayLimitR:2,start:"15:30",end:"17:30",rules:[{si:"pierdo dos seguidas,",entonces:"me levanto 15 minutos."},{si:"la entrada no está en mi estrategia,",entonces:"no entro y lo apunto."}],strategy:"",tone:"cercano"};
const S={user:null,name:"",plan:null,planDoc:null,consents:{},trades:[],bridge:null,newKey:null,loaded:false,authMode:"login",authMsg:"",authErr:"",chan:null};

/* ---------- utilidades ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(v,d=1)=>Number(v).toLocaleString("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtR=r=>r==null||!isFinite(r)?"—":(r>0?"+":r<0?"−":"")+num(Math.abs(r),1)+" R";
const fmtPct=p=>p==null?"—":num(p,p<1?2:1).replace(/,?0+$/,"")+" %";
const hhmm=t=>t?new Date(t).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}):"—";
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const todayKey=()=>dayKey(Date.now());
const DIAS=["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"],MESES=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const MESES_L=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fechaCorta=t=>{const d=new Date(t);return DIAS[d.getDay()]+" "+d.getDate()+" "+MESES[d.getMonth()]};
const minOf=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||"");return m?(+m[1])*60+(+m[2]):null};
const minOfDate=t=>{const d=new Date(t);return d.getHours()*60+d.getMinutes()};
const ago=t=>{const s=(Date.now()-new Date(t).getTime())/1000;if(!isFinite(s))return "";if(s<90)return "ahora mismo";if(s<3600)return "hace "+Math.round(s/60)+" min";if(s<86400)return "hace "+Math.round(s/3600)+" h";return "hace "+Math.round(s/86400)+" d"};
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
const ICON={
 hoy:'<path d="M3 18h18M7 18V9M12 18V5M17 18v-6"/>',
 progreso:'<path d="M3 17l5-5 4 3 8-8M15 7h5v5"/>',
 grupo:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
 aprender:'<path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3zM21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/>',
 plan:'<path d="M6 3h12v18l-6-4-6 4z"/>',
 analizar:'<path d="M7 3v4M7 15v6M17 3v6M17 15v6"/><rect x="5" y="7" width="4" height="8" rx="1"/><rect x="15" y="9" width="4" height="6" rx="1"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 down:'<path d="M5 19h14M12 5v10M8 11l4 4 4-4"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const ico=(n,s=22,w=2,c="currentColor")=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const NAV=[["hoy","Hoy"],["progreso","Progreso"],["grupo","Grupo"],["aprender","Aprender"],["plan","Mi plan"]];
const NAV_SIDE=[["hoy","Hoy"],["analizar","Analizar"],["progreso","Progreso"],["grupo","Grupo"],["aprender","Aprender"],["plan","Mi plan"]];

/* ---------- plan (los cambios valen desde mañana) ---------- */
function effectivePlan(){
  const d=S.planDoc||{};
  let p=Object.assign({},DEFAULT_PLAN,d.current||{});
  if(d.pending&&d.pendingFrom&&d.pendingFrom<=todayKey())p=Object.assign(p,d.pending);
  return p;
}
async function savePlan(changes,immediate){
  const d=Object.assign({},S.planDoc||{});
  if(immediate||!d.current){d.current=Object.assign({},effectivePlan(),changes);delete d.pending;delete d.pendingFrom}
  else{
    if(d.pending&&d.pendingFrom<=todayKey()){d.current=Object.assign({},d.current,d.pending);delete d.pending}
    const t=new Date();t.setDate(t.getDate()+1);
    d.pending=Object.assign({},d.pending||{},changes);d.pendingFrom=dayKey(t);
  }
  const {error}=await sb.from("docs").upsert({user_id:S.user.id,col:"v1",id:"plan",data:d,updated_at:new Date().toISOString()});
  if(error){toast("No se pudo guardar: "+error.message);return false}
  S.planDoc=d;S.plan=effectivePlan();return true;
}

/* ---------- cómo fue cada operación ---------- */
function dayTradesOf(t){return S.trades.filter(x=>x.open_time&&dayKey(x.open_time)===dayKey(t.open_time)).sort((a,b)=>new Date(a.open_time)-new Date(b.open_time))}
function evaluate(t){
  const p=S.plan, day=dayTradesOf(t), idx=day.findIndex(x=>x.id===t.id);
  const before=day.slice(0,Math.max(0,idx)).reduce((s,x)=>s+(x.r||0),0);
  const c=[];
  c.push({ok:t.sl!=null,good:"Stop puesto desde la entrada",bad:"Entraste sin stop",fix:"Pon el stop al entrar, antes de nada más."});
  if(t.sl!=null)c.push({ok:!t.sl_moved,good:"No moviste el stop en contra",bad:"Moviste el stop en contra",fix:"Deja el stop donde lo pusiste: si el precio llega, la operación ya estaba pensada así."});
  if(t.risk_pct!=null)c.push({ok:t.risk_pct<=p.riskPct*1.15,good:"Riesgo el previsto: "+fmtPct(t.risk_pct),bad:"Arriesgaste "+fmtPct(t.risk_pct)+", más que tu "+fmtPct(p.riskPct),fix:"Calcula el tamaño con tu riesgo antes de entrar."});
  const s=minOf(p.start),e=minOf(p.end),m=minOfDate(t.open_time);
  if(s!=null&&e!=null)c.push({ok:m>=s&&m<=e,good:"Dentro de tu horario",bad:"Fuera de tu horario ("+p.start+"–"+p.end+")",fix:"Opera solo en tu horario; fuera de él, gráfico cerrado."});
  if(idx>=0)c.push({ok:idx<p.maxTrades,good:"Dentro de tus "+p.maxTrades+" operaciones",bad:"Operación número "+(idx+1)+": tu máximo es "+p.maxTrades,fix:"Cuando llegues a tu máximo, cierra el día."});
  if(idx>0)c.push({ok:before>-p.dayLimitR,good:"Antes de tu límite del día",bad:"Ya habías llegado a tu límite del día",fix:"Al llegar a tu límite, se acabó el día."});
  const fail=c.filter(x=>!x.ok), good=fail.length===0;
  let mejora=fail.length?fail[0].fix:null;
  if(!mejora&&!t.tp)mejora="Entraste sin objetivo puesto. Ponlo al entrar y así la salida no la decide el momento.";
  let title=t.status!=="closed"?"Abierta":good?(t.r!=null&&t.r<0?"Pérdida buena":"Buena"):"Evitable";
  return {checks:c,good,mejora,title,okCount:c.length-fail.length,total:c.length,fail};
}

/* ---------- datos ---------- */
async function loadAll(){
  const uid=S.user.id;
  const [plan,cons,trades,keys]=await Promise.all([
    sb.from("docs").select("data").eq("col","v1").eq("id","plan").maybeSingle(),
    sb.from("consents").select("kind,version,granted,created_at"),
    sb.from("trades").select("*").order("open_time",{ascending:false}).limit(500),
    sb.from("bridge_keys").select("created_at,last_seen,last_info").maybeSingle()
  ]);
  if(trades.error&&/relation|does not exist|schema cache/i.test(trades.error.message)){S.dbMissing=true}
  S.planDoc=plan.data?plan.data.data:null;S.plan=effectivePlan();
  S.consents={};(cons.data||[]).forEach(c=>{if(c.version===LEGAL_VERSION)S.consents[c.kind]=c.granted});
  S.trades=trades.data||[];S.bridge=keys.data||null;S.loaded=true;
  drainInbox();
}
async function drainInbox(){
  if(drainInbox.busy)return;drainInbox.busy=true;
  try{
    for(let round=0;round<4;round++){
      const {data,error}=await sb.from("bridge_inbox").select("id,trade_id,kind,png_b64").order("id").limit(5);
      if(error||!data||!data.length)break;
      for(const row of data){
        try{
          const bin=atob(String(row.png_b64).replace(/\s/g,""));const bytes=new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
          const safe=row.trade_id.replace(/[^a-zA-Z0-9_-]/g,"-");
          const path=`${S.user.id}/capturas/${safe}-${row.kind}-${Math.random().toString(36).slice(2,10)}.png`;
          const up=await sb.storage.from("media").upload(path,new Blob([bytes],{type:"image/png"}),{contentType:"image/png",upsert:false});
          if(up.error)throw up.error;
          const col=row.kind==="entry"?"capture_entry":"capture_exit";
          await sb.from("trades").update({[col]:path}).eq("id",row.trade_id);
          await sb.from("bridge_inbox").delete().eq("id",row.id);
          const t=S.trades.find(x=>x.id===row.trade_id);if(t)t[col]=path;
        }catch(e){console.warn("captura",e);await sb.from("bridge_inbox").delete().eq("id",row.id)}
      }
      render();
    }
  }finally{drainInbox.busy=false}
}
function subscribe(){
  if(S.chan||!sb)return;
  S.chan=sb.channel("trades-"+S.user.id).on("postgres_changes",{event:"*",schema:"public",table:"trades",filter:"user_id=eq."+S.user.id},payload=>{
    const row=payload.new;if(!row||!row.id)return;
    const i=S.trades.findIndex(x=>x.id===row.id);
    if(i>=0)S.trades[i]=Object.assign(S.trades[i],row);else S.trades.unshift(row);
    S.trades.sort((a,b)=>new Date(b.open_time)-new Date(a.open_time));
    if(payload.eventType==="INSERT")toast(row.symbol+": operación apuntada");
    render();setTimeout(drainInbox,1500);
  }).subscribe();
}

/* ---------- piezas visuales ---------- */
function vela(r,h=36){
  const mid=h/2, len=r==null?2:Math.max(3,Math.min(mid-2,Math.abs(r)*7));
  const top=r==null?mid-1:r>=0?mid-len:mid+1;
  return `<div class="vela" style="height:${h}px" aria-hidden="true"><div style="position:absolute;left:0;top:${mid}px;width:12px;height:1px;background:var(--gris)"></div><div style="position:absolute;left:3px;top:${top}px;width:6px;height:${len}px;border-radius:2px;background:var(--tinta)"></div></div>`;
}
function regla(trades,dayR,limit){
  const x=r=>Math.max(1,Math.min(99,(r+2.5)/5*100));
  const wall=x(-limit);
  let h=`<div class="regla" role="img" aria-label="Regla de R: tu límite está en −${num(limit,1)} R y el día va en ${fmtR(dayR)}">`;
  h+=`<div style="position:absolute;left:0;top:24px;width:${wall}%;height:30px;background:repeating-linear-gradient(135deg,#e1e6ee 0 4px,#fff 4px 8px);border-right:2px solid var(--tinta)"></div>`;
  h+=`<div style="position:absolute;left:0;top:54px;width:100%;height:1px;background:var(--gris)"></div>`;
  h+=`<div class="lbl" style="position:absolute;left:4px;top:8px;font-size:9px">Límite −${num(limit,1)} R</div>`;

function franja(trades,plan){
  const X=m=>Math.max(0,Math.min(100,(m-480)/(15*60)*100));

  let h=`<div class="franja" role="img" aria-label="Franja del día de 8 a 23 h con Londres, Nueva York, tu horario de ${esc(plan.start)} a ${esc(plan.end)} y tus operaciones">`;
  h+=`<div style="position:absolute;left:${X(540)}%;width:${X(1050)-X(540)}%;top:4px;height:13px;border-radius:4px;background:#dce3f0"></div><div style="position:absolute;left:calc(${X(540)}% + 5px);top:4px;font-size:9px;line-height:13px;color:var(--suave)">Londres</div>`;
  h+=`<div style="position:absolute;left:${X(930)}%;width:${X(1320)-X(930)}%;top:22px;height:13px;border-radius:4px;background:#dce3f0"></div><div style="position:absolute;left:calc(${X(1060)}% + 5px);top:22px;font-size:9px;line-height:13px;color:var(--suave)">Nueva York</div>`;
  h+=`<div style="position:absolute;left:${X(s)}%;width:${Math.max(1,X(e)-X(s))}%;top:0;height:39px;border-radius:7px;background:rgba(36,67,199,.14);border:1.5px solid var(--cobalto)"></div>`;
  trades.forEach(t=>{h+=`<div style="position:absolute;left:${X(minOfDate(t.open_time))}%;top:39px;width:2px;height:7px;background:var(--cobalto)"></div>`});
  if(now>=480&&now<=1380)h+=`<div style="position:absolute;left:${X(now)}%;top:-4px;width:2px;height:47px;background:var(--tinta)"></div>`;
  h+=`</div><div style="position:relative;height:14px">`;
  [8,12,16,20,23].forEach(hh=>{h+=`<span class="mono" style="position:absolute;left:calc(${X(hh*60)}% - ${hh===23?16:0}px);font-size:9px;color:var(--suave)">${String(hh).padStart(2,"0")}</span>`});
  return h+`</div>`;
}

function tvSymbol(s){
  const b=String(s||"EURUSD").toUpperCase().replace(/[^A-Z0-9]/g,"");
  const map={XAUUSD:"OANDA:XAUUSD",XAGUSD:"OANDA:XAGUSD",NAS100:"OANDA:NAS100USD",USTEC:"OANDA:NAS100USD",NDX100:"OANDA:NAS100USD",US100:"OANDA:NAS100USD",US30:"OANDA:US30USD",DJ30:"OANDA:US30USD",US500:"OANDA:SPX500USD",SPX500:"OANDA:SPX500USD",GER40:"OANDA:DE30EUR",DE40:"OANDA:DE30EUR",GER30:"OANDA:DE30EUR",UK100:"OANDA:UK100GBP",BTCUSD:"BITSTAMP:BTCUSD",ETHUSD:"BITSTAMP:ETHUSD",USOIL:"TVC:USOIL",WTI:"TVC:USOIL"};
  const key=Object.keys(map).find(k=>b.startsWith(k));
  if(key)return map[key];
  if(/^[A-Z]{6}$/.test(b.slice(0,6)))return "FX:"+b.slice(0,6);
  return b;
}

function calcEntry(){
  const a=S.an, info=symbolsInfo().find(x=>x.s===a.sym), p=S.plan;
  const n=v=>{const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:null};
  const e=n(a.entry),s=n(a.stop),t=n(a.tp), bal=S.bridge&&S.bridge.last_info&&+S.bridge.last_info.balance||null;
  const cur=(S.bridge&&S.bridge.last_info&&S.bridge.last_info.currency)||"€";
  const out={ok:false,msg:"",lots:null,riskPct:null,rr:null};
  if(e==null||s==null){out.msg="Escribe la entrada y el stop.";return out}
  const dirOk=a.side==="buy"?s<e&&(t==null||t>e):s>e&&(t==null||t<e);
  if(!dirOk){out.msg=a.side==="buy"?"En una compra el stop va por debajo de la entrada y el objetivo por encima.":"En una venta el stop va por encima de la entrada y el objetivo por debajo.";return out}
  out.rr=t!=null?Math.abs(t-e)/Math.abs(e-s):null;
  if(!info||!bal){out.msg=!info?"Para calcular el tamaño, ten este mercado en la Observación de mercado de MT5 (el programa puente envía sus datos cada 5 minutos).":"Falta el saldo de tu cuenta: llegará con la próxima señal del programa puente.";return out}
  const riskMoney=bal*p.riskPct/100, lossPerLot=Math.abs(e-s)/info.ts*info.tv;
  let lots=Math.floor((riskMoney/lossPerLot)/info.vstep+1e-9)*info.vstep;
  if(info.vmax)lots=Math.min(lots,info.vmax);
  if(lots<info.vmin){out.msg=`El stop está demasiado lejos para tu riesgo: ni el mínimo de ${num(info.vmin,2)} lotes cabe en tu ${fmtPct(p.riskPct)}.`;out.tooFar=true;return out}
  out.ok=true;out.lots=lots;out.riskPct=lots*lossPerLot/bal*100;out.riskMoney=lots*lossPerLot;out.cur=cur;return out;
}

  const tk=todayKey(), today=S.trades.filter(t=>t.open_time&&dayKey(t.open_time)===tk), dayR=today.reduce((x,t)=>x+(t.r||0),0);

      else if(S.authMode==="signup"){
        if(document.getElementById("aPass").value.length<8)throw new Error("La contraseña necesita al menos 8 caracteres.");
        const {data,error}=await sb.auth.signUp({email:v("aEmail"),password:document.getElementById("aPass").value,options:{data:{name:v("aName")},emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;if(!data.session){S.authMode="login";S.authMsg="Te hemos enviado un correo para confirmar tu cuenta."}
      }else if(S.authMode==="reset"){const {error}=await sb.auth.resetPasswordForEmail(v("aEmail"),{redirectTo:location.origin+location.pathname});if(error)throw error;S.authMsg="Revisa tu correo: te hemos enviado el enlace."}
      else if(S.authMode==="newpass"){const {error}=await sb.auth.updateUser({password:document.getElementById("aPass").value});if(error)throw error;S.authMode="login";toast("Contraseña cambiada")}
    }catch(err){S.authErr=traducir(err.message)}
    btn.disabled=false;if(!S.user)render();
  };
}
function traducir(m){m=String(m||"");if(/Invalid login/i.test(m))return "Correo o contraseña incorrectos.";if(/Email not confirmed/i.test(m))return "Confirma tu correo antes de entrar (revisa la bandeja de entrada).";if(/already registered/i.test(m))return "Ya hay una cuenta con ese correo.";if(/rate limit/i.test(m))return "Demasiados intentos. Espera unos minutos.";return m}
function bindConsent(){
  const f=document.getElementById("consentForm");
  document.getElementById("consentOut").onclick=()=>sb.auth.signOut();
  f.onsubmit=async e=>{
    e.preventDefault();const err=document.getElementById("consentErr");
    if(!f.adult.checked||!f.risk.checked||!f.privacy.checked){err.textContent="Marca las tres primeras casillas para continuar.";err.hidden=false;return}
    const rows=["adult","risk","privacy","health"].map(k=>({user_id:S.user.id,kind:k,version:LEGAL_VERSION,granted:!!f[k].checked}));
    const {error}=await sb.from("consents").upsert(rows);
    if(error){err.textContent="No se pudo guardar: "+error.message+(/relation|schema cache/.test(error.message)?" (falta pegar supabase-v1.sql en Supabase)":"");err.hidden=false;return}
    rows.forEach(r=>S.consents[r.kind]=r.granted);
    if(!S.planDoc||!S.planDoc.current)await savePlan({},true);
    location.hash="#plan";render();
  };
}
function bindView(r){
  if(r.view==="analizar"){
    const a=S.an;
    const prefill=()=>{const info=symbolsInfo().find(x=>x.s===a.sym);if(info&&info.p&&!a.entry){a.entry=String(info.p);const el=document.getElementById("anEntry");if(el)el.value=a.entry}};
    prefill();
    document.getElementById("anSym").onchange=e=>{a.sym=e.target.value;a.entry="";a.stop="";a.tp="";["anEntry","anStop","anTp"].forEach(id=>document.getElementById(id).value="");prefill();mountTV();paintAnalizar()};
    [["anEntry","entry"],["anStop","stop"],["anTp","tp"]].forEach(([id,k])=>document.getElementById(id).oninput=e=>{a[k]=e.target.value;paintAnalizar()});
    document.querySelectorAll("[data-side]").forEach(b=>b.onclick=()=>{a.side=b.dataset.side;document.querySelectorAll("[data-side]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.side===a.side)));paintAnalizar()});
    const fb=document.getElementById("tvFull"),card=document.getElementById("tvcard");
    const ex=document.getElementById("tvExit");
    const setFull=on=>{card.classList.toggle("full",on);ex.hidden=!on;document.body.style.overflow=on?"hidden":""};
    fb.onclick=()=>setFull(true);ex.onclick=()=>setFull(false);
    document.onkeydown=e=>{if(e.key==="Escape"&&card.classList.contains("full"))setFull(false)};
    mountTV();paintAnalizar();
  }
  if(r.view==="op"){
    const t=S.trades.find(x=>x.id===r.id);if(!t)return;
    const saveReview=async patch=>{t.review=Object.assign({},t.review||{},patch);const {error}=await sb.from("trades").update({review:t.review}).eq("id",t.id);if(error)toast("No se pudo guardar")};
    document.querySelectorAll("[data-feel]").forEach(b=>b.onclick=()=>{const f=b.dataset.feel;saveReview({feel:(t.review||{}).feel===f?null:f});document.querySelectorAll("[data-feel]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.feel===(t.review||{}).feel)))});
    const why=document.getElementById("why");if(why)why.onchange=()=>saveReview({why:why.value.slice(0,2000)});
  }
  if(r.view==="plan"){
    const f=document.getElementById("planForm");
    const readRules=()=>{const rules=[];f.querySelectorAll("[data-rule]").forEach(i=>{const k=+i.dataset.rule;rules[k]=rules[k]||{si:"",entonces:""};rules[k][i.dataset.part]=i.value.trim()});return rules.filter(x=>x&&(x.si||x.entonces))};
    document.getElementById("addRule").onclick=()=>{const p=S.plan;p.rules=readRules().concat([{si:"",entonces:""}]);render()};
    f.onsubmit=async e=>{
      e.preventDefault();
      const ch={riskPct:+f.riskPct.value,maxTrades:Math.round(+f.maxTrades.value),dayLimitR:+f.dayLimitR.value,start:f.start.value,end:f.end.value,strategy:f.strategy.value.trim(),rules:readRules()};
      if(!(ch.riskPct>0)||!(ch.maxTrades>0)||!(ch.dayLimitR>0)||minOf(ch.start)==null||minOf(ch.end)==null||minOf(ch.start)>=minOf(ch.end)){toast("Revisa los números y el horario");return}
      const first=!(S.planDoc&&S.planDoc.current&&S.planDoc.saved);
      const ok=await savePlan(Object.assign(ch),first);
      if(ok){if(first){S.planDoc.saved=true;await sb.from("docs").upsert({user_id:S.user.id,col:"v1",id:"plan",data:S.planDoc})}toast(first?"Plan guardado. Vale desde hoy.":"Guardado. Vale desde mañana.");render()}
    };
    document.getElementById("newKey").onclick=async()=>{
      if(S.bridge&&!confirmInline("newKey","¿Seguro? La clave anterior dejará de funcionar. Pulsa otra vez para confirmar."))return;
      const {data,error}=await sb.rpc("create_bridge_key");
      if(error){toast("No se pudo crear: "+error.message);return}
      S.newKey=data;S.bridge={created_at:new Date().toISOString(),last_seen:null,last_info:{}};render();
      document.getElementById("mt5").scrollIntoView({behavior:"smooth",block:"start"});
    };
    const ck=document.getElementById("copyKey");if(ck)ck.onclick=async()=>{try{await navigator.clipboard.writeText(S.newKey);toast("Clave copiada")}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("keyText"));getSelection().removeAllRanges();getSelection().addRange(r);toast("Selecciónala y cópiala")}};
    document.getElementById("healthToggle").onclick=async()=>{
      const v=!(S.consents.health===true);
      const {error}=await sb.from("consents").upsert({user_id:S.user.id,kind:"health",version:LEGAL_VERSION,granted:v});
      if(error){toast("No se pudo cambiar");return}
      S.consents.health=v;toast(v?"Permiso dado":"Permiso quitado");render();
    };
    const ni=document.getElementById("nameInput");ni.onchange=async()=>{const n=ni.value.trim().slice(0,40);if(!n)return;S.name=n;await sb.auth.updateUser({data:{name:n}});toast("Nombre guardado")};
    document.getElementById("logoutBtn").onclick=()=>sb.auth.signOut();
    document.getElementById("exportBtn").onclick=()=>{
      const blob=new Blob([JSON.stringify({exportado:new Date().toISOString(),plan:S.planDoc,operaciones:S.trades,permisos:S.consents},null,2)],{type:"application/json"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mi-bitacora.json";document.body.appendChild(a);a.click();a.remove();
    };
    document.getElementById("delBtn").onclick=async()=>{
      if(document.getElementById("delConfirm").value.trim()!=="BORRAR"){toast("Escribe BORRAR para confirmar");return}
      // primero tus fotos (la base de datos no puede borrar archivos)
      try{
        const paths=[];
        const walk=async(prefix,depth)=>{const {data}=await sb.storage.from("media").list(prefix,{limit:1000});for(const f of data||[]){const p=prefix+"/"+f.name;if(f.id)paths.push(p);else if(depth<3)await walk(p,depth+1)}};
        await walk(S.user.id,0);
        for(let i=0;i<paths.length;i+=100)await sb.storage.from("media").remove(paths.slice(i,i+100));
      }catch(e){console.warn(e)}
      const {error}=await sb.rpc("delete_my_account");if(error){toast("No se pudo borrar: "+error.message);return}
      await sb.auth.signOut();toast("Cuenta borrada");
    };
  }
}
function confirmInline(id,msg){const b=document.getElementById(id);if(b.dataset.armed==="1"){b.dataset.armed="";return true}b.dataset.armed="1";const old=b.textContent;b.textContent=msg;setTimeout(()=>{if(b.isConnected){b.dataset.armed="";b.textContent=old}},5000);return false}

window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
setInterval(()=>{if(S.user&&S.loaded&&!document.activeElement.matches("input,textarea"))render()},60000);
setInterval(async()=>{if(!S.user||!S.loaded)return;const {data}=await sb.from("bridge_keys").select("created_at,last_seen,last_info").maybeSingle();if(data){S.bridge=data}},300000);

async function onSession(session,event){
  if(event==="PASSWORD_RECOVERY"){S.user=null;S.authMode="newpass";render();return}
  const u=session&&session.user;
  if(!u){S.user=null;S.loaded=false;if(S.chan){sb.removeChannel(S.chan);S.chan=null}render();return}
  if(S.user&&S.user.id===u.id)return;
  S.user=u;S.name=(u.user_metadata&&u.user_metadata.name)||(u.email||"").split("@")[0]||"Trader";S.loaded=false;render();
  await loadAll();subscribe();render();
}
if(SB_OK){
  sb.auth.onAuthStateChange((event,session)=>{setTimeout(()=>onSession(session,event),0)});
  sb.auth.getSession().then(({data})=>onSession(data.session,"INIT"));
}else render();
})();
</script>
